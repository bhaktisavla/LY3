<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Dinosaurs</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:'Baloo 2',cursive;
touch-action:manipulation;
}

body{

background:url("assets/backdrop.jpg") center center/cover no-repeat;

display:flex;
justify-content:center;
align-items:center;

}

/*-----------------------------*/

.screen{

position:absolute;

inset:0;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

}

/*-----------------------------*/

.hidden{

display:none;

}

/*-----------------------------*/

#logo{

width:min(65vw,340px);

animation:pop .8s ease;

}

/*-----------------------------*/

#title{

font-size:clamp(38px,7vw,70px);

font-weight:800;

background:linear-gradient(90deg,
#ff595e,
#ffca3a,
#8ac926,
#1982c4,
#6a4c93);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

animation:flash 1s infinite;

}

/*-----------------------------*/

#startBtn{

margin-top:35px;

padding:18px 45px;

font-size:clamp(22px,4vw,34px);

font-weight:800;

border:none;

border-radius:60px;

background:#FFB703;

color:white;

box-shadow:0 6px 15px rgba(0,0,0,.25);

animation:pulse 1.2s infinite;

}

/*-----------------------------*/

#game{

display:none;

flex-direction:column;

align-items:center;

justify-content:flex-start;

width:100%;

height:100%;

padding:1vh;

}

/*-----------------------------*/

h1{

font-size:clamp(34px,5vw,54px);

font-weight:800;

background:linear-gradient(to right,#ff595e,#ffca3a,#8ac926,#1982c4);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

/*-----------------------------*/

.questionBar{

width:95%;

display:flex;

justify-content:center;

align-items:center;

gap:15px;

margin-top:.5vh;

}

#question{

font-size:clamp(19px,2.7vw,28px);

font-weight:700;

color:#08415c;

text-align:center;

}

/*-----------------------------*/

#speaker{

width:55px;
height:55px;

border:none;
border-radius:50%;

background:#FFD166;

font-size:28px;

cursor:pointer;

display:flex;
justify-content:center;
align-items:center;

box-shadow:0 4px 10px rgba(0,0,0,.25);

transition:.2s;

}

#speaker:active{

transform:scale(.92);

}

/*-----------------------------*/

.board{

position:relative;

margin-top:1vh;

width:96%;

height:78%;

background:rgba(255,255,255,.85);

border-radius:30px;

border:5px solid white;

display:grid;

grid-template-columns:1fr 1fr;

padding:2vw;

}

/*-----------------------------*/

.column{

display:flex;

flex-direction:column;

justify-content:space-evenly;

align-items:center;

}

/*-----------------------------*/

.card{

position:relative;

z-index:2;
    
width:min(23vw,150px);

height:min(12vh,95px);

background:white;

border-radius:18px;

border:4px solid #FFD166;

display:flex;

justify-content:center;

align-items:center;

box-shadow:0 5px 12px rgba(0,0,0,.15);

}

.card img{

max-width:90%;

max-height:90%;

object-fit:contain;

pointer-events:none;

}

/*-----------------------------*/

.shadow{

border-color:#8E9AAF;

}

/*-----------------------------*/

.selected{

border:5px solid #4CAF50;

box-shadow:0 0 18px rgba(76,175,80,.6);

transform:scale(1.05);

}

/*-----------------------------*/

.wrong{

animation:shake .35s;

}

/*-----------------------------*/

#svgLayer{

position:absolute;

left:0;

top:0;

width:100%;

height:100%;

pointer-events:none;

z-index:0;

}

/*-----------------------------*/

#message{

position:absolute;

top:42%;

left:50%;

transform:translate(-50%,-50%);

font-size:clamp(42px,8vw,75px);

font-weight:800;

background:linear-gradient(90deg,#ff006e,#ffbe0b,#38b000,#3a86ff);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

display:none;

z-index:20;

}

/*-----------------------------*/

#finish{

position:absolute;

inset:0;

display:none;

flex-direction:column;

justify-content:center;

align-items:center;

background:rgba(255,255,255,.45);

backdrop-filter:blur(4px);

z-index:50;

}

#finish h2{

font-size:clamp(48px,9vw,90px);

background:linear-gradient(to right,#ff006e,#ffbe0b,#3a86ff,#38b000);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

#playAgain{

margin-top:30px;

font-size:60px;

cursor:pointer;

animation:pulse 1.3s infinite;

}

/*-----------------------------*/

@keyframes pulse{

50%{

transform:scale(1.08);

}

}

/*-----------------------------*/

@keyframes flash{

50%{

opacity:.4;

}

}

/*-----------------------------*/

@keyframes shake{

20%{transform:translateX(-6px);}

40%{transform:translateX(6px);}

60%{transform:translateX(-6px);}

80%{transform:translateX(6px);}

}

/*-----------------------------*/

@keyframes pop{

from{

transform:scale(.5);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}

/*-----------------------------*/

@media(max-width:700px){

.card{

width:34vw;

height:10vh;

}

#speaker{

width:46px;

height:46px;

}

.board{

height:76%;

}

}
/*-----------------------------
CONFETTI
-----------------------------*/

.confetti{

position:fixed;

width:12px;

height:12px;

border-radius:50%;

pointer-events:none;

animation:fall 3.5s linear forwards;

z-index:999;

}

@keyframes fall{

0%{

transform:translateY(-40px) rotate(0deg);

opacity:1;

}

100%{

transform:translateY(110vh) rotate(720deg);

opacity:0;

}

}
    
</style>

</head>

<body>

<!-- Logo -->

<div id="logoScreen" class="screen">

<img id="logo" src="assets/innovine-logo.png">

</div>

<!-- Title -->

<div id="titleScreen" class="screen hidden">

<div id="title">Dinosaurs</div>

<button id="startBtn">
Tap to Start
</button>

</div>

<!-- Game -->

<div id="game">

<h1>Dinosaurs</h1>

<div class="questionBar">

<div id="question">

Look at the dinosaur and tap on its matching shadow.

</div>

<button id="speaker" aria-label="Hear the question again">🔊</button>

</div>

<div class="board" id="board">

<svg id="svgLayer" width="100%" height="100%"></svg>

<div class="column">

<div class="card dinosaur" data-id="1"><img src="assets/brachiosaurus.png"></div>

<div class="card dinosaur" data-id="2"><img src="assets/stegosaurus.png"></div>

<div class="card dinosaur" data-id="3"><img src="assets/T-rex.png"></div>

<div class="card dinosaur" data-id="4"><img src="assets/triceratops.png"></div>

<div class="card dinosaur" data-id="5"><img src="assets/velociraptor.png"></div>

</div>

<div class="column">

<div class="card shadow" data-id="2"><img src="assets/stegosaurus_shadow.png"></div>

<div class="card shadow" data-id="4"><img src="assets/triceratops_shadow.png"></div>

<div class="card shadow" data-id="5"><img src="assets/velociraptor_shadow.png"></div>

<div class="card shadow" data-id="1"><img src="assets/brachiosaurus_shadow.png"></div>

<div class="card shadow" data-id="3"><img src="assets/T-rex_shadow.png"></div>

</div>

</div>

<div id="message">

Good Job!

</div>

<div id="finish">

<h2>Awesome!</h2>

<div id="playAgain">

🔄

</div>

</div>

</div>

<audio id="clap" src="assets/clap.mp3"></audio>

<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>

/*-----------------------------
SCREEN FLOW
-----------------------------*/

const logoScreen=document.getElementById("logoScreen");
const titleScreen=document.getElementById("titleScreen");
const game=document.getElementById("game");

setTimeout(()=>{

logoScreen.classList.add("hidden");
titleScreen.classList.remove("hidden");

},5000);

document.getElementById("startBtn").onclick=()=>{

titleScreen.classList.add("hidden");

game.style.display="flex";

speakQuestion();

};

/*-----------------------------
VOICE
-----------------------------*/

const questionText="Look at the dinosaur and tap on its matching shadow.";

function speakQuestion(){

speechSynthesis.cancel();

const msg=new SpeechSynthesisUtterance(questionText);

msg.rate=0.85;

msg.pitch=1;

speechSynthesis.speak(msg);

}

document.getElementById("speaker").onclick=speakQuestion;

/*-----------------------------
MATCHING
-----------------------------*/

const dinosaurs=document.querySelectorAll(".dinosaur");

const shadows=document.querySelectorAll(".shadow");

const clap=document.getElementById("clap");

const wrong=document.getElementById("wrongSound");

const svg=document.getElementById("svgLayer");

let selected=null;

let completed=0;

/*-----------------------------
SELECT DINOSAUR
-----------------------------*/

dinosaurs.forEach(card=>{

card.addEventListener("click",()=>{

if(card.dataset.done==="yes") return;

/* Remove previously selected dinosaur */

if(selected){

selected.classList.remove("selected");

}

/* Remove all green borders */

dinosaurs.forEach(c=>c.classList.remove("selected"));

/* Select the new dinosaur */

selected=card;

card.classList.add("selected");

});

});

/*-----------------------------
SELECT SHADOW
-----------------------------*/

shadows.forEach(card=>{

card.addEventListener("click",()=>{

if(!selected) return;

if(card.dataset.done==="yes") return;

if(selected.dataset.id===card.dataset.id){

correctMatch(selected,card);

}

else{

wrong.currentTime=0;

wrong.play();

card.classList.add("wrong");

setTimeout(()=>{

card.classList.remove("wrong");

},350);

/* Clear the selected dinosaur so the learner can try again */

selected.classList.remove("selected");

selected=null;

}

});

});

/*-----------------------------
CORRECT MATCH
-----------------------------*/

function correctMatch(left,right){

left.dataset.done="yes";

right.dataset.done="yes";

left.classList.add("selected");

right.classList.add("selected");

drawLine(left,right);

selected=null;

completed++;

if(completed===5){

setTimeout(finishRound,700);

}

}
/*-----------------------------
DRAW GREEN LINE
-----------------------------*/

function drawLine(left,right){

const board=document.getElementById("board");

const b=board.getBoundingClientRect();

const l=left.getBoundingClientRect();

const r=right.getBoundingClientRect();

const x1=l.right-b.left;

const y1=l.top+l.height/2-b.top;

const x2=r.left-b.left;

const y2=r.top+r.height/2-b.top;

const line=document.createElementNS("http://www.w3.org/2000/svg","line");

line.setAttribute("x1",x1);

line.setAttribute("y1",y1);

line.setAttribute("x2",x2);

line.setAttribute("y2",y2);

line.setAttribute("stroke","#3CB043");

line.setAttribute("stroke-width","8");

line.setAttribute("stroke-linecap","round");

svg.appendChild(line);

}
/*-----------------------------
ROUND COMPLETE
-----------------------------*/

function finishRound(){

document.getElementById("message").style.display="block";

clap.currentTime=0;

clap.play();

launchConfetti();

setTimeout(()=>{

document.getElementById("message").style.display="none";

document.getElementById("finish").style.display="flex";

},1800);

}

/*-----------------------------
CONFETTI
-----------------------------*/

function launchConfetti(){

const colours=[

"#ff595e",

"#ffca3a",

"#8ac926",

"#1982c4",

"#6a4c93",

"#ff006e",

"#00b4d8"

];

for(let i=0;i<160;i++){

const c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*100+"vw";

c.style.background=colours[Math.floor(Math.random()*colours.length)];

c.style.animationDelay=(Math.random()*1.2)+"s";

c.style.transform=`scale(${0.6+Math.random()})`;

document.body.appendChild(c);

setTimeout(()=>c.remove(),4200);

}

}
/*-----------------------------
PLAY AGAIN
-----------------------------*/

document.getElementById("playAgain").onclick=function(){

speechSynthesis.cancel();

/* remove green lines */

svg.innerHTML="";

/* reset dinosaurs */

dinosaurs.forEach(card=>{

card.dataset.done="";

card.classList.remove("selected");

});

/* reset shadows */

shadows.forEach(card=>{

card.dataset.done="";

card.classList.remove("selected");

});

/* reset variables */

selected=null;

completed=0;

/* hide finish */

document.getElementById("finish").style.display="none";

document.getElementById("message").style.display="none";

/* restart */

game.style.display="none";

svg.innerHTML="";   

titleScreen.classList.add("hidden");

logoScreen.classList.remove("hidden");

setTimeout(()=>{

logoScreen.classList.add("hidden");

titleScreen.classList.remove("hidden");

},5000);

};    

</script>

</body>

</html>
