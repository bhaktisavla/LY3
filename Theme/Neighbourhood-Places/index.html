<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neighbourhood Places – Jr.KG Game</title>
<style>
body {
    margin:0;
    font-family:'Arbutus', cursive;
    background: linear-gradient(135deg, #a2caff, #ffd9a2);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    color:#333;
}
#splash, #titleScreen, #game, #endScreen { 
    width:100%; 
    height:100vh; 
    display:none; 
    flex-direction:column; 
    align-items:center; 
    justify-content:center; 
}
#splash img { width:200px; height:auto; }
h1 { font-size:2em; margin:10px; text-align:center; color:#4b2e83; }
#questionBox {
    margin:10px 0; 
    font-size:1.4em; 
    text-align:center; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    gap:10px; 
    flex-wrap:wrap;
}
.place-container, .options-container {
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    margin:10px 0;
    width: 95%;
}
.place-box, .option-box {
    border:2px solid #999;
    border-radius:12px;
    padding:5px;
    background:#fff;
    flex:1 1 45%;
    max-width:300px;
    text-align:center;
    cursor:pointer;
    transition: transform 0.2s, box-shadow 0.2s;
}
.place-box img, .option-box img {
    width:100%;
    height:auto;
    display:block;
    margin-bottom:5px;
}
.option-box.horizontal img {
    width: 200px; /* Round 5 horizontal board */
}
.correct { border-color: green; box-shadow:0 0 15px green; }
.wrong { animation: wiggle 0.3s; }
@keyframes wiggle {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(5deg); }
    50% { transform: rotate(-5deg); }
    75% { transform: rotate(5deg); }
    100% { transform: rotate(0deg); }
}
#hearAgain { margin-left:10px; cursor:pointer; color:#fff; background:#4b2e83; padding:5px 10px; border-radius:8px; }
#endScreen h1 { color:#4b2e83; text-align:center; }
#playAgain { margin-top:20px; padding:10px 20px; font-size:1.2em; border:none; border-radius:12px; background:#4b2e83; color:#fff; cursor:pointer; }
</style>
</head>
<body>

<div id="splash" style="display:flex;">
    <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<div id="titleScreen">
    <h1>Neighbourhood Places</h1>
</div>

<div id="game">
    <div id="questionBox">
        <span id="questionText"></span>
        <button id="hearAgain">🔊 Hear Again</button>
    </div>
    <div class="place-container">
        <div class="place-box" id="placeBox">
            <img id="placeImg" src="" alt="Place">
            <div id="placeLabel"></div>
        </div>
    </div>
    <div class="options-container">
        <div class="option-box" id="option1">
            <img src="" alt="Option 1">
            <div class="option-label"></div>
        </div>
        <div class="option-box" id="option2">
            <img src="" alt="Option 2">
            <div class="option-label"></div>
        </div>
    </div>
</div>

<div id="endScreen">
    <h1>🎉 Good Job! You completed all rounds! 🎉</h1>
    <button id="playAgain">Play Again</button>
</div>

<audio id="audioCorrect" src="assets/correct.mp3"></audio>
<audio id="audioWrong" src="assets/wrong.mp3"></audio>
<audio id="audioClap" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const rounds = [
    {place:'airport', placeImg:'assets/airport.png', options:[{img:'assets/aeroplane.png', label:'aeroplane'}, {img:'assets/ship.png', label:'ship'}], correct:'assets/aeroplane.png'},
    {place:'hospital', placeImg:'assets/hospital.png', options:[{img:'assets/ambulance.png', label:'ambulance'}, {img:'assets/train.png', label:'train'}], correct:'assets/ambulance.png'},
    {place:'bank', placeImg:'assets/bank.png', options:[{img:'assets/basket.png', label:'basket'}, {img:'assets/rupee.png', label:'rupee'}], correct:'assets/rupee.png'},
    {place:'school', placeImg:'assets/school.png', options:[{img:'assets/docto.png', label:'doctor'}, {img:'assets/teacher.png', label:'teacher'}], correct:'assets/teacher.png'},
    {place:'supermarket', placeImg:'assets/supermarket.png', options:[{img:'assets/cart.png', label:'cart'}, {img:'assets/board.png', label:'board', horizontal:true}], correct:'assets/cart.png'},
    {place:'gasstation', placeImg:'assets/gasstation.png', options:[{img:'assets/gas.png', label:'petrol'}, {img:'assets/icecreamcart.png', label:'ice-cream cart'}], correct:'assets/gas.png'},
    {place:'firestation', placeImg:'assets/firestation.png', options:[{img:'assets/tractor.png', label:'tractor'}, {img:'assets/fireengine.png', label:'fire engine'}], correct:'assets/fireengine.png'},
    {place:'park', placeImg:'assets/park.png', options:[{img:'assets/bed.png', label:'bed'}, {img:'assets/slide.png', label:'slide'}], correct:'assets/slide.png'},
    {place:'policestation', placeImg:'assets/policestation.png', options:[{img:'assets/policeman.png', label:'policeman'}, {img:'assets/farmer.png', label:'farmer'}], correct:'assets/policeman.png'},
];

let currentRound = 0;
let wrongAttempts = 0;

const splash = document.getElementById('splash');
const titleScreen = document.getElementById('titleScreen');
const game = document.getElementById('game');
const endScreen = document.getElementById('endScreen');

const questionText = document.getElementById('questionText');
const hearAgainBtn = document.getElementById('hearAgain');

const placeImg = document.getElementById('placeImg');
const placeLabel = document.getElementById('placeLabel');

const option1 = document.getElementById('option1');
const option2 = document.getElementById('option2');

const audioCorrect = document.getElementById('audioCorrect');
const audioWrong = document.getElementById('audioWrong');
const audioClap = document.getElementById('audioClap');

const playAgainBtn = document.getElementById('playAgain');

function speakText(text){
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    speechSynthesis.speak(utterance);
}

function loadRound(){
    wrongAttempts = 0;
    const round = rounds[currentRound];
    questionText.textContent = "Look at the place at the top. Tap on the vehicle or person or object that belongs there.";
    speakText(questionText.textContent);
    
    placeImg.src = round.placeImg;
    placeLabel.textContent = round.place;

    const opts = [option1, option2];
    opts.forEach((opt,i)=>{
        opt.querySelector('img').src = round.options[i].img;
        opt.querySelector('.option-label').textContent = round.options[i].label;
        opt.className = 'option-box';
        if(round.options[i].horizontal){
            opt.classList.add('horizontal');
        }
    });
}

function handleOptionClick(e){
    const selectedImg = e.currentTarget.querySelector('img').src;
    const correctImg = rounds[currentRound].correct;
    if(selectedImg.includes(correctImg)){
        e.currentTarget.classList.add('correct');
        audioCorrect.play();
        audioClap.play();
        setTimeout(()=> {
            currentRound++;
            if(currentRound < rounds.length){
                loadRound();
            }else{
                game.style.display = 'none';
                endScreen.style.display = 'flex';
                confettiEffect();
            }
        },1000);
    }else{
        e.currentTarget.classList.add('wrong');
        audioWrong.play();
        wrongAttempts++;
        if(wrongAttempts >=2){
            const opts = [option1, option2];
            opts.forEach(opt=>{
                if(opt.querySelector('img').src.includes(correctImg)){
                    opt.classList.add('correct');
                }
            });
        }
    }
}

hearAgainBtn.addEventListener('click', ()=> speakText(questionText.textContent));
option1.addEventListener('click', handleOptionClick);
option2.addEventListener('click', handleOptionClick);
playAgainBtn.addEventListener('click', ()=>{
    currentRound = 0;
    endScreen.style.display='none';
    game.style.display='flex';
    loadRound();
});

function confettiEffect(){
    const duration = 2 * 1000;
    const end = Date.now() + duration;
    (function frame(){
        const timeLeft = end - Date.now();
        if(timeLeft <= 0) return;
        const conf = document.createElement('div');
        conf.textContent = '🎊';
        conf.style.position = 'fixed';
        conf.style.fontSize = Math.floor(Math.random()*24+12)+'px';
        conf.style.top = Math.random()*window.innerHeight+'px';
        conf.style.left = Math.random()*window.innerWidth+'px';
        conf.style.zIndex = 9999;
        document.body.appendChild(conf);
        setTimeout(()=>{ conf.remove(); }, 2000);
        requestAnimationFrame(frame);
    }());
}

splash.style.display='flex';
setTimeout(()=>{
    splash.style.display='none';
    titleScreen.style.display='flex';
    setTimeout(()=>{
        titleScreen.style.display='none';
        game.style.display='flex';
        loadRound();
    },5000);
},5000);
</script>
</body>
</html>
