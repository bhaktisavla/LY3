<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Before and After Numbers</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Comic Sans MS","Trebuchet MS",sans-serif;
  background:linear-gradient(
to bottom,
#87ceff 0%,
#b8ecff 35%,
#dff8ff 70%,
#ffffff 100%
);
}

  .cloud{
position:fixed;
background:white;
border-radius:50px;
opacity:.8;
z-index:-1;
}

.cloud:before,
.cloud:after{
content:"";
position:absolute;
background:white;
border-radius:50%;
}

.cloud1{
width:120px;
height:40px;
top:12%;
left:-150px;
animation:floatCloud 35s linear infinite;
}

.cloud1:before{
width:50px;
height:50px;
left:15px;
top:-25px;
}

.cloud1:after{
width:60px;
height:60px;
right:15px;
top:-30px;
}

.cloud2{
width:160px;
height:50px;
top:28%;
left:-200px;
animation:floatCloud 45s linear infinite;
}

.cloud2:before{
width:70px;
height:70px;
left:20px;
top:-35px;
}

.cloud2:after{
width:80px;
height:80px;
right:20px;
top:-40px;
}

.cloud3{
width:130px;
height:45px;
top:45%;
left:-180px;
animation:floatCloud 40s linear infinite;
}

.cloud3:before{
width:55px;
height:55px;
left:20px;
top:-25px;
}

.cloud3:after{
width:65px;
height:65px;
right:15px;
top:-30px;
}

@keyframes floatCloud{
from{
transform:translateX(0);
}
to{
transform:translateX(calc(100vw + 250px));
}
}
  
#logoScreen{
  position:fixed;
  inset:0;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
}

#logoScreen img{
  max-width:75%;
  max-height:60%;
}

.game{
  width:100vw;
  height:calc(var(--vh,1vh)*100);
  display:none;
  flex-direction:column;
  align-items:center;
  padding:6px;
  overflow:hidden;
}

h1{
  margin:4px 0;
  font-size:clamp(22px,5vw,34px);
  color:#178bd3;
  text-align:center;
}

.instruction{
  font-size:clamp(16px,4vw,22px);
  color:#444;
  text-align:center;
  margin:4px 0;
}

.questionArea{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin:4px 0;
width:100%;
}

.questionArea .instruction{
margin:0;
}

.questionArea #hearBtn{
width:50px;
height:50px;
min-width:50px;
padding:0;
border-radius:50%;
background:#2b9fd9;
font-size:24px;
display:flex;
align-items:center;
justify-content:center;
}
.planeBox{
  position:relative;
  width:100%;
  max-width:900px;
  height:50%;
  min-height:260px;

  display:flex;
  align-items:center;
  justify-content:center;
}

 .planeBox img{
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.25));
}
  
.numberRow{
  position:absolute;
  top:50%;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
}

.numBox{
  width:clamp(54px,14vw,86px);
  height:clamp(50px,12vw,72px);
  border:4px solid #d94d73;
  border-radius:12px;
  background:white;
  color:blue;
  font-size:clamp(26px,7vw,40px);
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
}

.numBox input{
  width:100%;
  height:100%;
  border:none;
  outline:none;
  font-size:clamp(26px,7vw,40px);
  font-weight:bold;
  text-align:center;
  color:blue;
  background:transparent;
  font-family:inherit;
}

.correctGlow{
  border-color:#24a148!important;
  box-shadow:0 0 16px #24a148;
}

.wrongGlow{
  border-color:#d93025!important;
  box-shadow:0 0 16px #d93025;
}

.buttons{
  width:100%;
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:auto;
  padding-bottom:8px;
}

button{
  border:none;
  border-radius:12px;
  padding:12px 16px;
  font-size:clamp(15px,4vw,22px);
  font-weight:bold;
  font-family:inherit;
  cursor:pointer;
  color:white;
  min-width:135px;
}

#hearBtn{background:#2b9fd9}
#checkBtn{background:#80b918}

button:active{transform:scale(.96)}

.confetti{
  position:fixed;
  top:-10px;
  width:10px;
  height:16px;
  animation:fall 2.8s linear forwards;
}

@keyframes fall{
  to{transform:translateY(105vh) rotate(360deg)}
}

@media(max-width:600px){
  h1{font-size:28px}
  .instruction{font-size:20px}
  .planeBox{height:39%;min-height:230px}
  .numBox{width:60px;height:56px}
}

@media(max-height:680px){
  h1{font-size:22px}
  .instruction{font-size:17px}
  .planeBox{height:36%;min-height:190px}
  .feedback{font-size:18px}
  button{padding:9px 10px;font-size:15px}
}

@media(min-width:900px){

  .planeBox{
    max-width:1000px;
    height:55%;
  }

  .numberRow{
    top:52%;
  }

}  
</style>
</head>

<body>
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>
<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<div class="game" id="game">
  <h1>Before and After Numbers</h1>

  <div class="questionArea">

  <div class="instruction" id="questionText">
    Listen and type the missing number.
  </div>

  <button id="hearBtn" onclick="speakQuestion()">
    🔊
  </button>

</div>

  <div class="planeBox" id="planeBox">
    <img id="planeImg" src="assets/aeroplane.png" alt="Aeroplane">

    <div class="numberRow">
      <div class="numBox" id="box1"></div>
      <div class="numBox" id="box2"></div>
      <div class="numBox" id="box3"></div>
    </div>
  </div>

<div class="buttons" id="buttons"></div>  
</div>

<audio id="rightSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
function setRealHeight(){
  var vh=window.innerHeight*0.01;
  document.documentElement.style.setProperty("--vh",vh+"px");
}

setRealHeight();
window.addEventListener("resize",setRealHeight);

/*
Only before and after questions.
No repeated answer numbers.
*/
var questions=[
  {type:"before", number:2, answer:1},
  {type:"after", number:2, answer:3},
  {type:"before", number:5, answer:4},
  {type:"after", number:5, answer:6},
  {type:"before", number:8, answer:7},
  {type:"after", number:8, answer:9},
  {type:"before", number:12, answer:11},
  {type:"after", number:13, answer:14},
  {type:"before", number:18, answer:17},
  {type:"after", number:19, answer:20}
];

var planes=[
  "assets/aeroplane.png",
  "assets/aeroplane.png",
  "assets/aeroplane.png"
];

var current=0;
var movingNext=false;

window.onload=function(){
  setTimeout(function(){
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("game").style.display="flex";
    loadQuestion();
  },5000);
};

function loadQuestion(){
  movingNext=false;

  var q=questions[current];

   document.getElementById("planeImg").src=planes[current%planes.length];

  var boxes=[
    document.getElementById("box1"),
    document.getElementById("box2"),
    document.getElementById("box3")
  ];

  for(var i=0;i<3;i++){
    boxes[i].className="numBox";
    boxes[i].innerHTML="";
  }

  if(q.type==="before"){
    boxes[0].innerHTML='<input id="answerInput" type="number" inputmode="numeric" min="1" max="20" oninput="autoCheck()">';
    boxes[1].innerHTML=q.number;
    boxes[2].innerHTML=q.number+1;
    document.getElementById("questionText").innerHTML="Write the number that comes before "+q.number+"?";
  }

  if(q.type==="after"){
    boxes[0].innerHTML=q.number-1;
    boxes[1].innerHTML=q.number;
    boxes[2].innerHTML='<input id="answerInput" type="number" inputmode="numeric" min="1" max="20" oninput="autoCheck()">';
    document.getElementById("questionText").innerHTML="Write the number that comes after "+q.number+"?";
  }

  setTimeout(function(){

  var input=document.getElementById("answerInput");

  if(input){
    input.focus();
  }

},100);

setTimeout(function(){
  speakQuestion();
},400);
}

function speakQuestion(){
  var text=document.getElementById("questionText").innerText;

  if("speechSynthesis" in window){
    window.speechSynthesis.cancel();

    var speech=new SpeechSynthesisUtterance(text);
    speech.lang="en-IN";
    speech.rate=0.75;
    speech.pitch=1.1;

    window.speechSynthesis.speak(speech);
  }
}


function autoCheck(){

  var q=questions[current];

  var input=document.getElementById("answerInput");

  if(!input)return;

  clearTimeout(typingTimer);

  var requiredLength=q.answer.toString().length;

  if(input.value.length>=requiredLength){

    typingTimer=setTimeout(function(){
      checkAnswer();
    },500);

  }

}
  
function checkAnswer(){

  if(movingNext)return;

  var q=questions[current];

  var input=document.getElementById("answerInput");

  if(!input)return;

  var answerBox=input.parentElement;

  var value=parseInt(input.value,10);

  answerBox.className="numBox";

  if(value===q.answer){

    movingNext=true;

    answerBox.classList.add("correctGlow");

    playSound("rightSound");

    setTimeout(function(){

      current++;

      if(current>=questions.length){

        finishGame();

      }else{

        loadQuestion();

      }

    },1200);

  }else{

    answerBox.classList.add("wrongGlow");

    playSound("wrongSound");

    setTimeout(function(){

      answerBox.classList.remove("wrongGlow");

      input.value="";

      input.focus();

    },700);
  }
}

function finishGame(){

document.getElementById("questionText").innerHTML="";
document.getElementById("hearBtn").style.display="none";
document.getElementById("planeBox").innerHTML=
  `
  <div style="
      text-align:center;
      color:#178bd3;
      font-weight:bold;
      font-size:clamp(30px,8vw,60px);
  ">
      🎉 Well Done! 🎉
      <br><br>

      <button id="playAgainBtn"
      style="
      background:#ff7b00;
      font-size:clamp(18px,4vw,28px);
      padding:12px 24px;
      border:none;
      border-radius:18px;
      color:white;
      cursor:pointer;">
      🔄 Play Again
      </button>
  </div>
  `;


  document.getElementById("buttons").style.display="none";

  playSound("clapSound");

  makeConfetti();

  document.getElementById("playAgainBtn")
  .addEventListener("click",restartGame);
}

function restartGame(){

  current=0;
  movingNext=false;

  document.getElementById("hearBtn").style.display="flex";
  
  document.getElementById("buttons").style.display="flex";

  document.getElementById("planeBox").innerHTML=
  `
  <img id="planeImg" src="assets/aeroplane.png" alt="Aeroplane">

  <div class="numberRow">
      <div class="numBox" id="box1"></div>
      <div class="numBox" id="box2"></div>
      <div class="numBox" id="box3"></div>
  </div>
  `;

  loadQuestion();
}  

function playSound(id){
  var sound=document.getElementById(id);

  if(sound){
    sound.currentTime=0;
    sound.play();
  }
}

function makeConfetti(){

  var colors=[
  "#ff595e",
  "#ffca3a",
  "#8ac926",
  "#1982c4",
  "#6a4c93",
  "#ff85a1"
  ];

  for(let i=0;i<120;i++){

    let confetti=document.createElement("div");

    confetti.className="confetti";

    confetti.style.left=Math.random()*100+"vw";

    confetti.style.background=
    colors[Math.floor(Math.random()*colors.length)];

    confetti.style.animationDuration=
    (2+Math.random()*2)+"s";

    document.body.appendChild(confetti);

    setTimeout(()=>{
      confetti.remove();
    },5000);
  }
}
</script>

</body>
</html>
