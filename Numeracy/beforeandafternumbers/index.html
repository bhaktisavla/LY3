<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Before and After Numbers</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  overflow: hidden;
  font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
  background: #eaf8ff;
}

#logoScreen {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

#logoScreen img {
  max-width: 75%;
  max-height: 60%;
}

.game {
  width: 100vw;
  height: 100svh;
  min-height: 100vh;
  display: none;
  flex-direction: column;
  align-items: center;
  padding: 6px 8px 90px 8px;
  background: #eaf8ff;
  position: relative;
}

h1 {
  margin: 4px 0 6px 0;
  font-size: clamp(24px, 6vw, 38px);
  color: #178bd3;
  text-align: center;
}

.instruction {
  font-size: clamp(17px, 4vw, 24px);
  color: #444;
  text-align: center;
  min-height: 30px;
  margin-bottom: 6px;
}

.planeBox {
  position: relative;
  width: 96%;
  max-width: 760px;
  height: 50vh;
  max-height: 380px;
  min-height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.planeBox img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.numberRow {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: clamp(8px, 2vw, 18px);
}

.numBox {
  width: clamp(60px, 15vw, 92px);
  height: clamp(55px, 13vw, 76px);
  border: 4px solid #d94d73;
  border-radius: 12px;
  background: white;
  color: blue;
  font-size: clamp(28px, 7vw, 42px);
  font-weight: bold;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
}

.numBox input {
  width: 100%;
  height: 100%;
  border: none;
  outline: none;
  font-size: clamp(28px, 7vw, 42px);
  font-weight: bold;
  text-align: center;
  color: blue;
  background: transparent;
  font-family: inherit;
}

.correctGlow {
  border-color: #24a148 !important;
  box-shadow: 0 0 18px #24a148;
}

.wrongGlow {
  border-color: #d93025 !important;
  box-shadow: 0 0 18px #d93025;
}

.feedback {
  min-height: 34px;
  font-size: clamp(20px, 5vw, 30px);
  font-weight: bold;
  color: #444;
  text-align: center;
  margin-top: 4px;
}

.buttons {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  min-height: 78px;
  background: #eaf8ff;
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: center;
  padding: 10px;
  z-index: 50;
}

button {
  border: none;
  border-radius: 12px;
  padding: 12px 18px;
  font-size: clamp(16px, 4vw, 22px);
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
  color: white;
}

#hearBtn {
  background: #2b9fd9;
}

#checkBtn {
  background: #80b918;
}

button:active {
  transform: scale(0.96);
}

.confetti {
  position: fixed;
  top: -10px;
  width: 10px;
  height: 16px;
  animation: fall 2.8s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(105vh) rotate(360deg);
  }
}

@media (max-width: 600px) {
  .game {
    padding-bottom: 92px;
  }

  h1 {
    font-size: 30px;
    margin-top: 6px;
  }

  .instruction {
    font-size: 22px;
    margin-top: 4px;
  }

  .planeBox {
    height: 45vh;
    min-height: 300px;
    margin-top: 8px;
  }

  .numberRow {
    top: 46%;
  }

  .numBox {
    width: 64px;
    height: 60px;
  }

  .buttons {
    min-height: 82px;
  }
}

@media (max-height: 700px) {
  h1 {
    font-size: 24px;
  }

  .instruction {
    font-size: 18px;
  }

  .planeBox {
    height: 38vh;
    min-height: 230px;
  }

  .feedback {
    font-size: 20px;
  }
}

@media (max-height: 560px) {
  .planeBox {
    height: 34vh;
    min-height: 180px;
  }

  .numBox {
    width: 56px;
    height: 50px;
    font-size: 26px;
  }

  .numBox input {
    font-size: 26px;
  }

  button {
    padding: 8px 12px;
  }

  .buttons {
    min-height: 64px;
  }
}
</style>
</head>

<body>

<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<div class="game" id="game">
  <h1>Before and After Numbers</h1>

  <div class="instruction" id="questionText">
    Listen and type the missing number.
  </div>

  <div class="planeBox" id="planeBox">
    <img id="planeImg" src="assets/aeroplane.jpg" alt="Aeroplane">

    <div class="numberRow">
      <div class="numBox" id="box1"></div>
      <div class="numBox" id="box2"></div>
      <div class="numBox" id="box3"></div>
    </div>
  </div>

  <div class="feedback" id="feedback"></div>

  <div class="buttons" id="buttons">
    <button id="hearBtn" onclick="speakQuestion()">🔊 Hear Again</button>
    <button id="checkBtn" onclick="checkAnswer()">Check Answer</button>
  </div>
</div>

<audio id="rightSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
/*
The game should be mobile friendly, tab friendly, low connectivity,
it should also work on old phone models, android and IOS,
everything should fit in on one screen scrolling shouldn't be required.
*/

var questions = [
  { nums: [1, 2, 3], missing: 0 },
  { nums: [3, 4, 5], missing: 2 },
  { nums: [5, 6, 7], missing: 0 },
  { nums: [7, 8, 9], missing: 1 },
  { nums: [9, 10, 11], missing: 2 },
  { nums: [11, 12, 13], missing: 0 },
  { nums: [13, 14, 15], missing: 1 },
  { nums: [15, 16, 17], missing: 2 },
  { nums: [17, 18, 19], missing: 0 },
  { nums: [18, 19, 20], missing: 1 }
];

var planes = [
  "assets/aeroplane.jpg",
  "assets/aeroplanes.jfif",
  "assets/aeroplane.jpg"
];

var current = 0;

window.onload = function () {
  setTimeout(function () {
    document.getElementById("logoScreen").style.display = "none";
    document.getElementById("game").style.display = "flex";
    loadQuestion();
  }, 5000);
};

function loadQuestion() {
  var q = questions[current];

  document.getElementById("feedback").innerHTML = "";
  document.getElementById("planeImg").src = planes[current % planes.length];

  var boxes = [
    document.getElementById("box1"),
    document.getElementById("box2"),
    document.getElementById("box3")
  ];

  for (var i = 0; i < 3; i++) {
    boxes[i].className = "numBox";
    boxes[i].innerHTML = "";

    if (i === q.missing) {
      boxes[i].innerHTML = '<input id="answerInput" type="number" inputmode="numeric" min="1" max="20">';
    } else {
      boxes[i].innerHTML = q.nums[i];
    }
  }

  var text = "";

  if (q.missing === 0) {
    text = "What number comes before " + q.nums[1] + "?";
  } else if (q.missing === 1) {
    text = "What number comes between " + q.nums[0] + " and " + q.nums[2] + "?";
  } else {
    text = "What number comes after " + q.nums[1] + "?";
  }

  document.getElementById("questionText").innerHTML = text;

  setTimeout(function () {
    speakQuestion();
  }, 500);
}

function speakQuestion() {
  var text = document.getElementById("questionText").innerText;

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();

    var speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-IN";
    speech.rate = 0.75;
    speech.pitch = 1.1;

    window.speechSynthesis.speak(speech);
  }
}

function checkAnswer() {
  var q = questions[current];
  var input = document.getElementById("answerInput");

  if (!input) return;

  var answerBox = input.parentElement;
  var value = Number(input.value);

  answerBox.className = "numBox";

  if (value === q.nums[q.missing]) {
    answerBox.classList.add("correctGlow");
    document.getElementById("feedback").innerHTML = "Good Job! 🎉";
    playSound("rightSound");

    setTimeout(function () {
      current++;

      if (current >= questions.length) {
        finishGame();
      } else {
        loadQuestion();
      }
    }, 1800);

  } else {
    answerBox.classList.add("wrongGlow");
    document.getElementById("feedback").innerHTML = "Try Again 😊";
    playSound("wrongSound");
  }
}

function finishGame() {
  document.getElementById("questionText").innerHTML = "Finished!";
  document.getElementById("planeBox").innerHTML =
    '<div style="font-size:clamp(34px,8vw,60px);color:#178bd3;font-weight:bold;text-align:center;">🎉 Finished! 🎉<br>Well Done!</div>';

  document.getElementById("feedback").innerHTML = "You completed all 10 questions.";
  document.getElementById("buttons").style.display = "none";

  playSound("clapSound");
  makeConfetti();
}

function playSound(id) {
  var sound = document.getElementById(id);

  if (sound) {
    sound.currentTime = 0;
    sound.play();
  }
}

function makeConfetti() {
  var colors = ["#f7b801", "#f18701", "#2b9fd9", "#80b918", "#db4b70"];

  for (var i = 0; i < 60; i++) {
    var confetti = document.createElement("div");
    confetti.className = "confetti";
    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.animationDelay = Math.random() * 1.5 + "s";
    document.body.appendChild(confetti);

    setTimeout(function () {
      if (confetti && confetti.parentNode) {
        confetti.parentNode.removeChild(confetti);
      }
    }, 4000);
  }
}
</script>

</body>
</html>
