<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Above and Below – Jr.KG Pre-Math Game</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body, html { width:100%; height:100%; font-family: 'Arbutus', cursive; }
    body { background: #FFFBF0; display:flex; justify-content:center; align-items:center; flex-direction:column; }
    #splash, #header, #game, #endScreen { width:100%; height:100vh; display:none; flex-direction:column; align-items:center; justify-content:center; position:relative; }
    #splash img { width:200px; height:auto; }
    #header h1 { font-size: 3em; color: #FF7F50; text-align:center; animation: flash 1s infinite; margin-bottom:20px; }
    @keyframes flash { 0%,50%,100% {opacity:1;} 25%,75% {opacity:0.3;} }
    #questionBox { font-size:clamp(18px,2.5vw,28px); color:#4B0082; text-align:center; max-width:95%; margin-bottom:5px; line-height:1.2; }
    #hearAgain { font-size:1em; color:#006400; cursor:pointer; text-decoration:underline; margin-bottom:15px; }
   #imageContainer {
    position:relative;
    display:inline-block;
}
   #imageContainer img {
    width:95vw;
    max-height:80vh;
    object-fit:contain;
    display:block;
   pointer-events:none;
}
    canvas {
    position:absolute;
    top:0;
    left:0;
    z-index:9999;
    pointer-events:auto;
    border:3px solid blue;
}
    #endScreen h1 { font-size:2.5em; color:#FF4500; margin-bottom:20px; }
    #playAgain { padding:10px 20px; font-size:1.5em; background:#32CD32; color:white; border:none; border-radius:10px; cursor:pointer; }
</style>
</head>
<body>

<!-- Splash Screen -->
<div id="splash" style="display:flex;">
    <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Header Screen -->
<div id="header" style="display:flex;">
    <h1>Above-Below</h1>
</div>

<!-- Game Screen -->
<div id="game">
    <div id="questionBox"></div>
    <div id="hearAgain">Hear Again 🔊</div>
    <div id="imageContainer">
        <img id="gameImage" src="" alt="Game Image">
        <canvas id="drawCanvas"></canvas>
    </div>
</div>

<!-- End Screen -->
<div id="endScreen">
    <h1>Good Job! 🎉</h1>
    <button id="playAgain">Play Again</button>
</div>

<!-- Audio -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>
<audio id="voiceAudio" src=""></audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script>
const splash = document.getElementById('splash');
const header = document.getElementById('header');
const game = document.getElementById('game');
const endScreen = document.getElementById('endScreen');
const questionBox = document.getElementById('questionBox');
const hearAgain = document.getElementById('hearAgain');
const gameImage = document.getElementById('gameImage');
const canvas = document.getElementById('drawCanvas');
canvas.onclick = () => console.log("Canvas clicked");
const ctx = canvas.getContext('2d');


const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const clapSound = document.getElementById('clapSound');
const voiceAudio = document.getElementById('voiceAudio');

const playAgainBtn = document.getElementById('playAgain');

// Game rounds configuration
const rounds = [
    { image:'assets/above.png', question:'Circle the object above the house.', correctObjects:[{x:0.5,y:0.15,r:0.1},{x:0.7,y:0.12,r:0.08},{x:0.3,y:0.12,r:0.08}], voice:'assets/voice_round1.mp3' }, // sun + clouds
    { image:'assets/below.png', question:'Circle the object below the tree.', correctObjects:[{x:0.78,y:0.72,r:0.15}], voice:'assets/voice_round2.mp3' }, // boy
    { image:'assets/aboveandbelow.png', question:'Circle the object below the flower.', correctObjects:[{x:0.5,y:0.65,r:0.08}], voice:'assets/voice_round3.mp3' }, // butterfly
    { image:'assets/aboveandbelow1.png', question:'Circle the object above the lamp.', correctObjects:[{x:0.50,y:0.12,r:0.18}], voice:'assets/voice_round4.mp3' }, // photo frame
    { image:'assets/above1.png', question:'Circle the object above the table.', correctObjects:[{x:0.50,y:0.18,r:0.18}], voice:'assets/voice_round5.mp3' }, // lamp
    { image:'assets/below1.png', question:'Circle the object below the clouds.', correctObjects:[{x:0.50,y:0.52,r:0.18}], voice:'assets/voice_round6.mp3' }, // aeroplane
    { image:'assets/aboveandbelow3.png', question:'Circle the object above the tree.', correctObjects:[{x:0.50,y:0.12,r:0.15},{x:0.30,y:0.10,r:0.15},{x:0.72,y:0.10,r:0.15}], voice:'assets/voice_round7.mp3' }, // bird + clouds
    { image:'assets/aboveandbelow2.png', question:'Circle the object below the hot air balloon.', correctObjects:[{x:0.3,y:0.7,r:0.08},{x:0.5,y:0.7,r:0.08},{x:0.7,y:0.7,r:0.08}], voice:'assets/voice_round8.mp3' } // car + 2 trees
];

let currentRound = 0;
let attempts = 0;
let drawing = false;
let lastPos = {x:0,y:0};
let drawPoints = [];
let speechUnlocked = false;

function speakQuestion(){

    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(
        rounds[currentRound].question
    );

    utterance.rate = 0.9;
    utterance.pitch = 1.1;

    speechSynthesis.speak(utterance);
}
   // Resize canvas
function resizeCanvas(){

    canvas.width = gameImage.width;
    canvas.height = gameImage.height;

    canvas.style.width = gameImage.width + "px";
    canvas.style.height = gameImage.height + "px";
}

window.addEventListener('resize', resizeCanvas);

// Drawing handlers
function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX, clientY;
    if (e.touches) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
    else { clientX = e.clientX; clientY = e.clientY; }
    return { x: clientX - rect.left, y: clientY - rect.top };
}

canvas.addEventListener('mousedown', startDrawing);
canvas.addEventListener('mousemove', draw);
window.addEventListener('mouseup', endDrawing);

canvas.addEventListener('touchstart', startDrawing,{passive:false});
canvas.addEventListener('touchmove', draw,{passive:false});
canvas.addEventListener('touchend', endDrawing);

function startDrawing(e){

   drawPoints = [];
   
   console.log("Drawing started");
   
   if(!speechUnlocked){
        speechUnlocked = true;
        speakQuestion();
    }

    drawing = true;
    lastPos = getMousePos(e);
}
function draw(e){

    if(!drawing) return;

    e.preventDefault();

    const pos = getMousePos(e);

    ctx.strokeStyle = "#00CC00";
    ctx.lineWidth = 12;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.beginPath();
    ctx.moveTo(lastPos.x,lastPos.y);
    ctx.lineTo(pos.x,pos.y);
    ctx.stroke();

    lastPos = pos;
   drawPoints.push({
    x:pos.x,
    y:pos.y
});
}
   
function endDrawing(e){

    if(!drawing) return;

    drawing = false;

    console.log(
        "Round " + (currentRound + 1),
        "X=" + (lastPos.x / canvas.width).toFixed(2),
        "Y=" + (lastPos.y / canvas.height).toFixed(2)
    );

    checkCorrect();
}

// Check if any correct object is circled
function checkCorrect(){

    const round = rounds[currentRound];
    const rect = canvas.getBoundingClientRect();

    let hit = false;

    for(const obj of round.correctObjects){

        const cx = obj.x * rect.width;
        const cy = obj.y * rect.height;
        const r = obj.r * rect.width;

        for(const p of drawPoints){

            if(Math.hypot(p.x-cx,p.y-cy) < r){
                hit = true;
                break;
            }
        }

        if(hit) break;
    }

    if(hit){

        correctSound.play();
        clapSound.play();

        setTimeout(nextRound,800);

    }else{

        attempts++;
        wrongSound.play();

        setTimeout(()=>{
            ctx.clearRect(0,0,canvas.width,canvas.height);
        },300);

        if(attempts>=2){
            highlightCorrect();
        }
    }
}

// Highlight correct object
function highlightCorrect(){
    const round = rounds[currentRound];
    const rect = canvas.getBoundingClientRect();
    ctx.strokeStyle = 'yellow';
    ctx.lineWidth = 4;
    for(const obj of round.correctObjects){
        const cx = obj.x*rect.width;
        const cy = obj.y*rect.height;
        const r = obj.r*rect.width;
        ctx.beginPath();
        ctx.arc(cx,cy,r,0,2*Math.PI);
        ctx.stroke();
    }
}

// Next round
function nextRound(){
    attempts=0;
    currentRound++;
    if(currentRound>=rounds.length){ showEndScreen(); return; }
    loadRound();
}

// Load round
function loadRound(){

    const round = rounds[currentRound];

    ctx.clearRect(0,0,canvas.width,canvas.height);

    questionBox.textContent = round.question;

    gameImage.onload = function(){
        resizeCanvas();
    };

    gameImage.src = round.image;

    if(speechUnlocked){
        speakQuestion();
    }
}
function showEndScreen(){
    game.style.display='none';
    endScreen.style.display='flex';
    confetti({
        particleCount: 200,
        spread: 70,
        origin: { y: 0.6 }
    });
}

// Play Again
playAgainBtn.addEventListener('click',()=>{
    currentRound=0;
    attempts=0;
    endScreen.style.display='none';
    game.style.display='flex';
    loadRound();
});

// Hear Again
hearAgain.addEventListener('click',()=>{
    speakQuestion();
});

// Start game sequence
function startGame(){
    splash.style.display='flex';
    setTimeout(()=>{
        splash.style.display='none';
        header.style.display='flex';
        setTimeout(()=>{
            header.style.display='none';
            game.style.display='flex';
           loadRound();
        },5000);
    },5000);
}

// Start
startGame();
</script>
</body>
</html>
