<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Number 0 Adventure</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
overflow:hidden;
font-family:Arial,sans-serif;
background:linear-gradient(to bottom,#8fd8ff,#eefbff);
touch-action:none;
}

#game{
width:100vw;
height:100vh;
position:relative;
overflow:hidden;
}

.screen{
position:absolute;
width:100%;
height:100%;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
padding:10px;
}

.active{
display:flex;
}

.title{
font-size:min(20vw,110px);
color:#ff4081;
animation:bounce 1s infinite alternate;
}

@keyframes bounce{
from{transform:translateY(0px);}
to{transform:translateY(-8px);}
}

.instruction{
background:white;
padding:12px 18px;
border-radius:18px;
font-size:min(5vw,30px);
text-align:center;
margin:12px;
max-width:92%;
box-shadow:0 3px 8px rgba(0,0,0,0.15);
line-height:1.3;
}

.play-btn{
padding:14px 28px;
font-size:min(6vw,30px);
border:none;
border-radius:18px;
background:#ff9800;
color:white;
cursor:pointer;
}

.choice-container{
display:flex;
gap:12px;
flex-wrap:wrap;
justify-content:center;
align-items:center;
width:100%;
}

.choice{
width:min(26vw,150px);
height:min(26vw,150px);
background:white;
border:5px solid #ff9800;
border-radius:22px;
display:flex;
justify-content:center;
align-items:center;
font-size:min(11vw,65px);
cursor:pointer;
}

.balloon{
width:min(18vw,90px);
position:absolute;
cursor:pointer;
animation:float 2s infinite alternate;
background:transparent;
mix-blend-mode:multiply;
}

@keyframes float{
from{transform:translateY(0px);}
to{transform:translateY(-10px);}
}

.pop{
animation:pop 0.3s forwards;
}

@keyframes pop{
to{
transform:scale(1.5);
opacity:0;
}
}

.basket-img{
width:min(38vw,220px);
cursor:pointer;
background:transparent;
mix-blend-mode:multiply;
}

.selected{
border:8px solid #4caf50;
border-radius:20px;
}

.falling{
position:absolute;
font-size:min(13vw,80px);
font-weight:bold;
color:#ff4081;
cursor:pointer;
user-select:none;
}

.trace-box{
width:min(78vw,340px);
height:min(78vw,340px);
background:white;
border:4px dashed #ff9800;
border-radius:20px;
position:relative;
overflow:hidden;
}

.trace-guide{
position:absolute;
font-size:min(58vw,250px);
color:#ffd6e7;
font-weight:bold;
left:50%;
top:50%;
transform:translate(-50%,-50%);
pointer-events:none;
}

canvas{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
touch-action:none;
}

.confetti{
position:absolute;
width:8px;
height:8px;
animation:fall linear infinite;
}

@keyframes fall{
from{
transform:translateY(-100px) rotate(0deg);
}
to{
transform:translateY(110vh) rotate(360deg);
}
}

#logoScreen{
position:absolute;
width:100%;
height:100%;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
}

#logoScreen img{
width:min(60vw,260px);
}

</style>
</head>

<body>

<!-- LOGO -->

<div id="logoScreen">

<img src="assets/innovine-logo.png">

</div>

<!-- AUDIO -->

<audio id="correctSound"
preload="auto"
src="assets/correct.mp3"></audio>

<audio id="wrongSound"
preload="auto"
src="assets/wrong.mp3"></audio>

<div id="game">

<!-- SCREEN 1 -->

<div class="screen" id="screen1">

<div class="title">0</div>

<div class="instruction">
Welcome to Number 0 adventure
</div>

<button class="play-btn"
onclick="showScreen(2)">
Play
</button>

</div>

<!-- SCREEN 2 -->

<div class="screen" id="screen2">

<div class="instruction">
Tap number 0
</div>

<div class="choice-container">

<div class="choice"
onclick="wrong()">5</div>

<div class="choice"
onclick="correct(3)">0</div>

<div class="choice"
onclick="wrong()">8</div>

</div>

</div>

<!-- SCREEN 3 -->

<div class="screen" id="screen3">

<div class="instruction">
Burst all balloons to make 0 balloons
</div>

<div id="balloonArea"
style="width:100%;
height:70%;
position:relative;">
</div>

</div>

<!-- SCREEN 4 -->

<div class="screen" id="screen4">

<div class="instruction">
Trace number 0
</div>

<div class="trace-box">

<div class="trace-guide">
0
</div>

<canvas id="traceCanvas"></canvas>

</div>

</div>

<!-- SCREEN 5 -->

<div class="screen" id="screen5">

<div class="instruction">
Tap the basket with 0 apples
</div>

<div class="choice-container">

<img src="assets/basketwithapples.jpg"
class="basket-img"
onclick="wrongBasket(this)">

<img src="assets/emptybasket.jpg"
class="basket-img"
onclick="correctBasket(this)">

</div>

</div>

<!-- SCREEN 6 -->

<div class="screen" id="screen6">

<div class="instruction">
Tap the box with 0 stars
</div>

<div class="choice-container">

<div class="choice"
onclick="wrong()">⭐</div>

<div class="choice"
onclick="correct(7)">
</div>

<div class="choice"
onclick="wrong()">⭐⭐</div>

</div>

</div>

<!-- SCREEN 7 -->

<div class="screen" id="screen7">

<div class="instruction">
Catch only number 0
</div>

<div id="fallingArea"
style="width:100%;
height:100%;
position:absolute;">
</div>

</div>

<!-- SCREEN 8 -->

<div class="screen" id="screen8">

<div id="confettiArea"></div>

<div class="title">
0
</div>

<div class="instruction">
Yay! You learned number 0
</div>

<button class="play-btn"
onclick="restartGame()">
Play again
</button>

</div>

</div>

<script>

let canvas;
let ctx;
let drawing=false;
let tracePoints=0;

window.onload=()=>{

setTimeout(()=>{

document.getElementById('logoScreen')
.style.display='none';

showScreen(1);

createBalloons();

setupTracing();

},5000);

}

function speak(text){

if(!window.speechSynthesis)return;

speechSynthesis.cancel();

let speech=
new SpeechSynthesisUtterance(text);

speech.lang="en-GB";
speech.rate=0.9;
speech.pitch=1;

speechSynthesis.speak(speech);

}

function playCorrect(){

let sound=
document.getElementById('correctSound');

sound.currentTime=0;

sound.play();

}

function playWrong(){

let sound=
document.getElementById('wrongSound');

sound.currentTime=0;

sound.play();

}

function showScreen(num){

document.querySelectorAll('.screen')
.forEach(s=>{
s.classList.remove('active');
});

document.getElementById('screen'+num)
.classList.add('active');

if(num===7){
startFallingGame();
}

if(num===8){
createConfetti();
}

}

function correct(next){

playCorrect();

setTimeout(()=>{
showScreen(next);
},700);

}

function wrong(){

playWrong();

}

function createBalloons(){

let area=
document.getElementById('balloonArea');

area.innerHTML='';

let images=[
'assets/redballoon.png',
'assets/greenballoon.png',
'assets/yellowballoon.png',
'assets/blueballoon.jfif',
'assets/redballoon.png'
];

for(let i=0;i<5;i++){

let balloon=
document.createElement('img');

balloon.src=images[i];

balloon.className='balloon';

balloon.style.left=
(8+i*18)+'%';

balloon.style.top=
(18+(i%2)*22)+'%';

area.appendChild(balloon);

balloon.onclick=()=>{

balloon.classList.add('pop');

playCorrect();

setTimeout(()=>{

balloon.remove();

checkBalloons();

},250);

}

}

}

function checkBalloons(){

let left=
document.querySelectorAll('.balloon')
.length;

if(left===0){

setTimeout(()=>{
showScreen(4);
},800);

}

}

function setupTracing(){

canvas=
document.getElementById('traceCanvas');

ctx=
canvas.getContext('2d');

resizeCanvas();

window.addEventListener('resize',
resizeCanvas);

canvas.addEventListener('mousedown',
startDraw);

canvas.addEventListener('mousemove',
draw);

canvas.addEventListener('mouseup',
stopDraw);

canvas.addEventListener('touchstart',
startDrawTouch,
{passive:false});

canvas.addEventListener('touchmove',
drawTouch,
{passive:false});

canvas.addEventListener('touchend',
stopDraw);

}

function resizeCanvas(){

canvas.width=
canvas.offsetWidth;

canvas.height=
canvas.offsetHeight;

}

function startDraw(e){

drawing=true;

ctx.beginPath();

ctx.moveTo(e.offsetX,e.offsetY);

}

function draw(e){

if(!drawing)return;

tracePoints++;

ctx.lineWidth=10;
ctx.lineCap='round';
ctx.strokeStyle='#ff4081';

ctx.lineTo(e.offsetX,e.offsetY);
ctx.stroke();

if(tracePoints>80){

setTimeout(()=>{
showScreen(5);
},500);

drawing=false;

}

}

function stopDraw(){

drawing=false;

}

function startDrawTouch(e){

e.preventDefault();

drawing=true;

let rect=
canvas.getBoundingClientRect();

let touch=e.touches[0];

ctx.beginPath();

ctx.moveTo(
touch.clientX-rect.left,
touch.clientY-rect.top
);

}

function drawTouch(e){

e.preventDefault();

if(!drawing)return;

tracePoints++;

let rect=
canvas.getBoundingClientRect();

let touch=e.touches[0];

ctx.lineWidth=10;
ctx.lineCap='round';
ctx.strokeStyle='#ff4081';

ctx.lineTo(
touch.clientX-rect.left,
touch.clientY-rect.top
);

ctx.stroke();

if(tracePoints>80){

setTimeout(()=>{
showScreen(5);
},500);

drawing=false;

}

}

function correctBasket(element){

playCorrect();

element.classList.add('selected');

setTimeout(()=>{
showScreen(6);
},700);

}

function wrongBasket(element){

playWrong();

element.style.transform='scale(0.95)';

setTimeout(()=>{
element.style.transform='scale(1)';
},200);

}

function startFallingGame(){

let area=
document.getElementById('fallingArea');

area.innerHTML='';

let caught=0;

let total=0;

let game=setInterval(()=>{

total++;

let item=
document.createElement('div');

item.className='falling';

let isZero=
Math.random()>0.5;

item.innerHTML=
isZero ? '0'
:
['3','5','8']
[Math.floor(Math.random()*3)];

item.style.left=
Math.random()*85+'vw';

item.style.top='-50px';

area.appendChild(item);

let speed=2;

let fall=setInterval(()=>{

item.style.top=
(item.offsetTop+speed)+'px';

if(item.offsetTop>
window.innerHeight){

clearInterval(fall);

item.remove();

}

},25);

item.onclick=()=>{

if(item.innerHTML==='0'){

playCorrect();

caught++;

item.remove();

}else{

playWrong();

}

if(caught>=5){

clearInterval(game);

setTimeout(()=>{
showScreen(8);
},800);

}

}

if(total>25){

clearInterval(game);

}

},900);

}

function createConfetti(){

let area=
document.getElementById('confettiArea');

area.innerHTML='';

let colors=[
'#ff4081',
'#2196f3',
'#4caf50',
'#ffeb3b',
'#ff9800',
'#9c27b0'
];

for(let i=0;i<80;i++){

let paper=
document.createElement('div');

paper.className='confetti';

paper.style.left=
Math.random()*100+'vw';

paper.style.background=
colors[Math.floor(Math.random()*colors.length)];

paper.style.animationDuration=
(2+Math.random()*3)+'s';

paper.style.width=
(4+Math.random()*6)+'px';

paper.style.height=
(4+Math.random()*6)+'px';

area.appendChild(paper);

}

}

function restartGame(){

document.getElementById('confettiArea')
.innerHTML='';

document.getElementById('fallingArea')
.innerHTML='';

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

tracePoints=0;

createBalloons();

showScreen(1);

}

</script>

</body>
</html>
