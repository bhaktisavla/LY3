<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Number 0 Adventure</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
overflow:hidden;
font-family:'Arial Rounded MT Bold',sans-serif;
touch-action:none;
background:linear-gradient(to bottom,#6ed0ff 0%,#9ae7ff 45%,#9be15d 45%,#7ed957 100%);
}

/* SKY */

.sky-cloud{
position:absolute;
background:white;
border-radius:50%;
opacity:0.9;
filter:blur(1px);
}

.cloud1{
width:140px;
height:70px;
top:25px;
left:20px;
}

.cloud2{
width:170px;
height:85px;
top:20px;
right:20px;
}

.cloud1::before,
.cloud2::before{
content:'';
position:absolute;
background:white;
border-radius:50%;
}

.cloud1::before{
width:80px;
height:80px;
top:-20px;
left:20px;
}

.cloud2::before{
width:90px;
height:90px;
top:-25px;
left:40px;
}

/* HILLS */

.hill{
position:absolute;
bottom:-80px;
width:450px;
height:250px;
background:#8fe05a;
border-radius:50%;
opacity:0.8;
}

.hill1{
left:-100px;
}

.hill2{
right:-100px;
background:#79d54f;
}

#game{
width:100vw;
height:100vh;
position:relative;
overflow:hidden;
}

.screen{
position:absolute;
width:100%;
height:100%;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
padding:10px;
z-index:2;
}

.active{
display:flex;
}

/* INSTRUCTION */

.instruction{
background:white;
padding:12px 20px;
border-radius:22px;
font-size:min(5vw,30px);
font-weight:bold;
text-align:center;
margin-bottom:20px;
box-shadow:0 5px 10px rgba(0,0,0,0.15);
max-width:90%;
}

/* TITLE */

.title{
font-size:min(26vw,130px);
font-weight:bold;
color:#ff4fa0;
text-shadow:
0 0 10px white,
0 4px 0 #d63384;
animation:bounce 1s infinite alternate;
}

@keyframes bounce{
from{
transform:translateY(0px);
}
to{
transform:translateY(-10px);
}
}

/* PLAY BUTTON */

.play-btn{
padding:15px 35px;
font-size:min(7vw,34px);
font-weight:bold;
border:none;
border-radius:22px;
cursor:pointer;

background:linear-gradient(
to bottom,
#ffd54f,
#ff9800
);

color:white;

box-shadow:
0 5px 0 #d67d00,
0 10px 15px rgba(0,0,0,0.2);
}

/* NUMBER CHOICES */

.choice-container{
display:flex;
gap:16px;
justify-content:center;
align-items:center;
flex-wrap:wrap;
}

.choice{
width:min(24vw,140px);
height:min(24vw,140px);

background:white;
border-radius:24px;

display:flex;
justify-content:center;
align-items:center;

font-size:min(16vw,80px);
font-weight:bold;

cursor:pointer;

box-shadow:
0 6px 12px rgba(0,0,0,0.18);
}

/* BALLOONS */

.balloon{
width:min(18vw,100px);
position:absolute;
cursor:pointer;
animation:float 2s infinite alternate;
}

/* REMOVE WHITE BACKGROUND */

img{
mix-blend-mode:multiply;
background:transparent;
}

/* FLOAT */

@keyframes float{
from{
transform:translateY(0px);
}
to{
transform:translateY(-12px);
}
}

/* TRACE */

.trace-box{
width:min(80vw,350px);
height:min(80vw,350px);

background:white;
border-radius:24px;

border:4px dashed orange;

position:relative;
overflow:hidden;

box-shadow:
0 6px 12px rgba(0,0,0,0.18);
}

.trace-guide{
position:absolute;
font-size:min(60vw,260px);
font-weight:bold;
color:#ffd1e8;

left:50%;
top:50%;

transform:translate(-50%,-50%);
pointer-events:none;
}

canvas{
position:absolute;
width:100%;
height:100%;
left:0;
top:0;
touch-action:none;
}

/* BASKETS */

.basket-container{
display:flex;
gap:12px;
justify-content:center;
align-items:center;
flex-wrap:wrap;
}

.basket{
width:min(38vw,230px);
cursor:pointer;
}

/* FALLING NUMBERS */

.falling{
position:absolute;
font-size:min(14vw,85px);
font-weight:bold;
cursor:pointer;
user-select:none;
animation:spin 3s linear infinite;
}

@keyframes spin{
from{
transform:rotate(0deg);
}
to{
transform:rotate(360deg);
}
}

/* CONFETTI */

.confetti{
position:absolute;
width:8px;
height:8px;
animation:fall linear infinite;
}

@keyframes fall{
from{
transform:translateY(-100px) rotate(0deg);
}
to{
transform:translateY(110vh) rotate(360deg);
}
}

/* LOGO */

#logoScreen{
position:absolute;
width:100%;
height:100%;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
}

#logoScreen img{
width:min(65vw,280px);
mix-blend-mode:normal;
}

/* FINAL SCREEN */

#screen8{
background:linear-gradient(to bottom,#003366,#001f4d);
}

</style>
</head>

<body>

<div class="sky-cloud cloud1"></div>
<div class="sky-cloud cloud2"></div>

<div class="hill hill1"></div>
<div class="hill hill2"></div>

<!-- LOGO -->

<div id="logoScreen">

<img src="assets/innovine-logo.png">

</div>

<!-- AUDIO -->

<audio id="correctSound"
src="assets/correct.mp3"></audio>

<audio id="wrongSound"
src="assets/wrong.mp3"></audio>

<div id="game">

<!-- SCREEN 1 -->

<div class="screen" id="screen1">

<div class="title">0</div>

<div class="instruction">
Welcome to Number 0 adventure
</div>

<button class="play-btn"
onclick="showScreen(2)">
Play
</button>

</div>

<!-- SCREEN 2 -->

<div class="screen" id="screen2">

<div class="instruction">
Tap number 0
</div>

<div class="choice-container">

<div class="choice"
onclick="wrong()">5</div>

<div class="choice"
onclick="correct(3)">0</div>

<div class="choice"
onclick="wrong()">8</div>

</div>

</div>

<!-- SCREEN 3 -->

<div class="screen" id="screen3">

<div class="instruction">
Burst all balloons to make 0 balloons
</div>

<div id="balloonArea"
style="width:100%;
height:70%;
position:relative;">
</div>

</div>

<!-- SCREEN 4 -->

<div class="screen" id="screen4">

<div class="instruction">
Trace number 0
</div>

<div class="trace-box">

<div class="trace-guide">
0
</div>

<canvas id="traceCanvas"></canvas>

</div>

</div>

<!-- SCREEN 5 -->

<div class="screen" id="screen5">

<div class="instruction">
Tap the basket with 0 apples
</div>

<div class="basket-container">

<img src="assets/basketwithapples.jpg"
class="basket"
onclick="wrong()">

<img src="assets/emptybasket.jpg"
class="basket"
onclick="correct(6)">

</div>

</div>

<!-- SCREEN 6 -->

<div class="screen" id="screen6">

<div class="instruction">
Tap the box with 0 stars
</div>

<div class="choice-container">

<div class="choice"
onclick="wrong()">⭐</div>

<div class="choice"
onclick="correct(7)"></div>

<div class="choice"
onclick="wrong()">⭐⭐</div>

</div>

</div>

<!-- SCREEN 7 -->

<div class="screen" id="screen7">

<div class="instruction">
Catch only number 0
</div>

<div id="fallingArea"
style="width:100%;
height:100%;
position:absolute;">
</div>

</div>

<!-- SCREEN 8 -->

<div class="screen" id="screen8">

<div id="confettiArea"></div>

<div class="title">
0
</div>

<div class="instruction">
Yay! You learned number 0
</div>

<button class="play-btn"
onclick="restartGame()">
Play again
</button>

</div>

</div>

<script>

let canvas;
let ctx;
let drawing=false;
let tracePoints=0;

/* SHOW LOGO */

window.onload=()=>{

showScreen(0);

setTimeout(()=>{

document.getElementById('logoScreen')
.style.display='none';

showScreen(1);

createBalloons();

setupTracing();

},5000);

}

/* AUDIO */

function playCorrect(){

let sound=
document.getElementById('correctSound');

sound.currentTime=0;
sound.play();

}

function playWrong(){

let sound=
document.getElementById('wrongSound');

sound.currentTime=0;
sound.play();

}

/* SCREEN */

function showScreen(num){

document.querySelectorAll('.screen')
.forEach(s=>{
s.classList.remove('active');
});

if(num>0){

document.getElementById('screen'+num)
.classList.add('active');

}

if(num===7){
startFallingGame();
}

if(num===8){
createConfetti();
}

}

/* ANSWERS */

function correct(next){

playCorrect();

setTimeout(()=>{
showScreen(next);
},700);

}

function wrong(){

playWrong();

}

/* BALLOONS */

function createBalloons(){

let area=
document.getElementById('balloonArea');

area.innerHTML='';

let images=[
'assets/redballoon.png',
'assets/greenballoon.png',
'assets/yellowballoon.png',
'assets/blueballoon.jfif',
'assets/redballoon.png'
];

for(let i=0;i<5;i++){

let balloon=
document.createElement('img');

balloon.src=images[i];

balloon.className='balloon';

balloon.style.left=
(8+i*18)+'%';

balloon.style.top=
(15+(i%2)*25)+'%';

area.appendChild(balloon);

balloon.onclick=()=>{

playCorrect();

balloon.style.display='none';

checkBalloons();

}

}

}

function checkBalloons(){

let visible=
0;

document.querySelectorAll('.balloon')
.forEach(b=>{

if(b.style.display!=='none'){
visible++;
}

});

if(visible===0){

setTimeout(()=>{
showScreen(4);
},800);

}

}

/* TRACING */

function setupTracing(){

canvas=
document.getElementById('traceCanvas');

ctx=
canvas.getContext('2d');

resizeCanvas();

window.addEventListener('resize',
resizeCanvas);

canvas.addEventListener('mousedown',
startDraw);

canvas.addEventListener('mousemove',
draw);

canvas.addEventListener('mouseup',
stopDraw);

canvas.addEventListener('touchstart',
startDrawTouch,
{passive:false});

canvas.addEventListener('touchmove',
drawTouch,
{passive:false});

canvas.addEventListener('touchend',
stopDraw);

}

function resizeCanvas(){

canvas.width=
canvas.offsetWidth;

canvas.height=
canvas.offsetHeight;

}

function startDraw(e){

drawing=true;

ctx.beginPath();

ctx.moveTo(e.offsetX,e.offsetY);

}

function draw(e){

if(!drawing)return;

tracePoints++;

ctx.lineWidth=10;
ctx.lineCap='round';
ctx.strokeStyle='#ff4fa0';

ctx.lineTo(e.offsetX,e.offsetY);
ctx.stroke();

if(tracePoints>80){

drawing=false;

playCorrect();

setTimeout(()=>{
showScreen(5);
},700);

}

}

function stopDraw(){

drawing=false;

}

function startDrawTouch(e){

e.preventDefault();

drawing=true;

let rect=
canvas.getBoundingClientRect();

let touch=e.touches[0];

ctx.beginPath();

ctx.moveTo(
touch.clientX-rect.left,
touch.clientY-rect.top
);

}

function drawTouch(e){

e.preventDefault();

if(!drawing)return;

tracePoints++;

let rect=
canvas.getBoundingClientRect();

let touch=e.touches[0];

ctx.lineWidth=10;
ctx.lineCap='round';
ctx.strokeStyle='#ff4fa0';

ctx.lineTo(
touch.clientX-rect.left,
touch.clientY-rect.top
);

ctx.stroke();

if(tracePoints>80){

drawing=false;

playCorrect();

setTimeout(()=>{
showScreen(5);
},700);

}

}

/* FALLING NUMBERS */

function startFallingGame(){

let area=
document.getElementById('fallingArea');

area.innerHTML='';

let caught=0;

let wrongNumbers=[
'3',
'4',
'5',
'8',
'9'
];

let colors=[
'#ff9800',
'#4caf50',
'#2196f3',
'#9c27b0',
'#ff4081'
];

let game=setInterval(()=>{

let item=
document.createElement('div');

item.className='falling';

let isZero=
Math.random()>0.5;

item.innerHTML=
isZero ? '0'
:
wrongNumbers[
Math.floor(
Math.random()*wrongNumbers.length
)
];

item.style.color=
colors[
Math.floor(
Math.random()*colors.length
)
];

item.style.left=
Math.random()*85+'vw';

item.style.top='-50px';

area.appendChild(item);

let speed=2;

let fall=setInterval(()=>{

item.style.top=
(item.offsetTop+speed)+'px';

if(item.offsetTop>
window.innerHeight){

clearInterval(fall);

item.remove();

}

},20);

item.onclick=()=>{

if(item.innerHTML==='0'){

playCorrect();

caught++;

item.remove();

}else{

playWrong();

}

if(caught>=5){

clearInterval(game);

setTimeout(()=>{
showScreen(8);
},700);

}

}

},900);

}

/* CONFETTI */

function createConfetti(){

let area=
document.getElementById('confettiArea');

area.innerHTML='';

let colors=[
'#ff4081',
'#2196f3',
'#4caf50',
'#ffeb3b',
'#ff9800',
'#9c27b0'
];

for(let i=0;i<90;i++){

let paper=
document.createElement('div');

paper.className='confetti';

paper.style.left=
Math.random()*100+'vw';

paper.style.background=
colors[Math.floor(Math.random()*colors.length)];

paper.style.animationDuration=
(2+Math.random()*3)+'s';

paper.style.width=
(4+Math.random()*6)+'px';

paper.style.height=
(4+Math.random()*6)+'px';

area.appendChild(paper);

}

}

/* RESTART */

function restartGame(){

document.getElementById('fallingArea')
.innerHTML='';

document.getElementById('confettiArea')
.innerHTML='';

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

tracePoints=0;

createBalloons();

showScreen(1);

}

</script>

</body>
</html>
