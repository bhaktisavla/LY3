<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Whole and Half</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:'Baloo 2',cursive;
}

/*-------------------------------
BACKGROUND
--------------------------------*/

body{

background:
radial-gradient(circle at 15% 20%,#FFE082 0 7%,transparent 7.5%),
radial-gradient(circle at 85% 18%,#80DEEA 0 7%,transparent 7.5%),
radial-gradient(circle at 22% 82%,#F8BBD0 0 8%,transparent 8.5%),
radial-gradient(circle at 78% 80%,#C5E1A5 0 7%,transparent 7.5%),
linear-gradient(180deg,#E3F2FD,#FFF8E1,#F3E5F5);

display:flex;
justify-content:center;
align-items:center;

}

/*-------------------------------
INTRO
--------------------------------*/

#introScreen{

position:fixed;
inset:0;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

z-index:50;

background:inherit;

}

#logo{

width:min(65vw,300px);

animation:fadeLogo 5s forwards;

}

@keyframes fadeLogo{

0%{opacity:0;}

20%{opacity:1;}

80%{opacity:1;}

100%{opacity:0;}

}

#titleScreen{

display:none;

flex-direction:column;

align-items:center;

gap:4vh;

animation:titleAppear .6s;

}

@keyframes titleAppear{

from{

opacity:0;
transform:scale(.8);

}

to{

opacity:1;
transform:scale(1);

}

}

#gameTitle{

font-size:clamp(36px,6vw,68px);

font-weight:800;

text-align:center;

background:linear-gradient(90deg,
#F44336,
#FF9800,
#4CAF50,
#2196F3,
#9C27B0);

background-size:300%;

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

animation:flashTitle 1s infinite;

}

@keyframes flashTitle{

0%{

filter:brightness(100%);
background-position:0%;

}

50%{

filter:brightness(140%);
background-position:100%;

}

100%{

background-position:0%;

}

}

/*-------------------------------
START BUTTON
--------------------------------*/

#startBtn{

padding:16px 40px;

font-size:clamp(22px,3vw,30px);

border:none;

border-radius:60px;

cursor:pointer;

font-weight:700;

background:#FFB74D;

color:white;

box-shadow:0 8px 18px rgba(0,0,0,.25);

animation:pulse 1.4s infinite;

}

@keyframes pulse{

0%,100%{

transform:scale(1);

}

50%{

transform:scale(1.08);

}

}

/*-------------------------------
GAME
--------------------------------*/

#game{

display:none;

width:100vw;

height:100vh;

padding:2vh 2vw;

display:flex;

flex-direction:column;

align-items:center;

justify-content:flex-start;

}

.heading{

width:100%;

text-align:center;

margin-bottom:1vh;

font-size:clamp(30px,5vw,48px);

font-weight:800;

background:linear-gradient(90deg,#E91E63,#FF9800,#4CAF50,#2196F3);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

/*-------------------------------
QUESTION
--------------------------------*/

#questionRow{

width:min(94vw,950px);

display:flex;

justify-content:center;

align-items:center;

gap:16px;

margin-top:1vh;

}

#questionText{

font-size:clamp(20px,2.8vw,30px);

font-weight:700;

text-align:center;

flex:1;

}

#speaker{

width:60px;

height:60px;

border:none;

border-radius:50%;

font-size:28px;

cursor:pointer;

background:white;

box-shadow:0 5px 12px rgba(0,0,0,.2);

}

#speaker:active{

transform:scale(.95);

}

/*-------------------------------
ROUND AREA
--------------------------------*/

#roundArea{

flex:1;

width:100%;

display:flex;

justify-content:center;

align-items:center;

position:relative;

overflow:hidden;

}

/*-------------------------------
IMAGE CARD
--------------------------------*/

.card{

background:#FFF8E1;

border:4px solid #6A1B9A;

border-radius:20px;

padding:10px;

display:flex;

justify-content:center;

align-items:center;

cursor:pointer;

transition:.25s;

}

.card img{

display:block;

width:100%;

height:100%;

object-fit:contain;

pointer-events:none;

}

.card:hover{

transform:scale(1.04);

}

.correct{

border-color:#43A047!important;

box-shadow:0 0 24px #66BB6A;

}

.wrong{

animation:shake .35s;

}

@keyframes shake{

0%{transform:translateX(0);}

25%{transform:translateX(-8px);}

50%{transform:translateX(8px);}

75%{transform:translateX(-8px);}

100%{transform:translateX(0);}

}

/*-------------------------------
GOOD JOB
--------------------------------*/

#message{

position:fixed;

top:42%;

left:50%;

transform:translate(-50%,-50%);

font-size:clamp(34px,6vw,60px);

font-weight:800;

background:linear-gradient(90deg,
#FF5722,
#FFC107,
#4CAF50,
#03A9F4,
#9C27B0);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

display:none;

z-index:100;

animation:pop .7s;

}

@keyframes pop{

0%{

transform:translate(-50%,-50%) scale(.3);

opacity:0;

}

100%{

transform:translate(-50%,-50%) scale(1);

opacity:1;

}

}

/*-------------------------------
MATCH SVG
--------------------------------*/

#lineLayer{

position:absolute;

left:0;

top:0;

width:100%;

height:100%;

pointer-events:none;

}

/*-------------------------------
FINISH
--------------------------------*/

#finishScreen{

display:none;

position:fixed;

inset:0;

background:rgba(255,255,255,.95);

flex-direction:column;

justify-content:center;

align-items:center;

gap:30px;

z-index:120;

}

#finishScreen h2{

font-size:clamp(42px,7vw,70px);

color:#FF9800;

}

#playAgain{

padding:18px 42px;

font-size:30px;

font-weight:700;

border:none;

border-radius:50px;

background:#4CAF50;

color:white;

cursor:pointer;

box-shadow:0 8px 18px rgba(0,0,0,.25);

}

/*-------------------------------
CONFETTI
--------------------------------*/

#confettiCanvas{

position:fixed;

inset:0;

pointer-events:none;

z-index:110;

}

/*-------------------------------
RESPONSIVE
--------------------------------*/

@media(max-width:700px){

#questionText{

font-size:22px;

}

.card{

padding:6px;

border-width:3px;

}

#speaker{

width:52px;

height:52px;

font-size:24px;

}

}

</style>

</head>

<body>

<!-- ======================================================
     INTRO SCREEN
====================================================== -->

<div id="introScreen">

    <img
    id="logo"
    src="assets/innovine-logo.png"
    alt="Innovine Logo">

    <div id="titleScreen">

        <h1 id="gameTitle">
            Whole and Half
        </h1>

        <button id="startBtn">
            Tap to Start
        </button>

    </div>

</div>

<!-- ======================================================
     MAIN GAME
====================================================== -->

<div id="game">

<header>

<h1 class="heading">
Whole and Half
</h1>

<div id="questionRow">

<div id="questionText">

Tap on the shape that is divided into halves.

</div>

<button id="speaker">

🔊

</button>

</div>

</header>

<!-- Good Job -->

<div id="message">

Good Job!

</div>

<!-- ROUND AREA -->

<div id="roundArea">

<!-- Filled using JavaScript -->

</div>

<!-- SVG MATCHING LINES -->

<svg id="lineLayer">

</svg>

</div>

<!-- ======================================================
     FINISH SCREEN
====================================================== -->

<div id="finishScreen">

<h2>

🎉 Awesome! 🎉

</h2>

<button id="playAgain">

Play Again

</button>

</div>

<!-- ======================================================
     CONFETTI
====================================================== -->

<canvas id="confettiCanvas"></canvas>

<!-- ======================================================
     AUDIO
====================================================== -->

<audio
id="clap"
src="assets/clap.mp3"
preload="auto">
</audio>

<audio
id="wrong"
src="assets/wrong.mp3"
preload="auto">
</audio>

<!-- ======================================================
     JAVASCRIPT
====================================================== -->

<script>

/*=========================================================
WHOLE & HALF GAME
PART 2A
=========================================================*/

const introScreen=document.getElementById("introScreen");
const titleScreen=document.getElementById("titleScreen");
const logo=document.getElementById("logo");

const startBtn=document.getElementById("startBtn");

const game=document.getElementById("game");

const questionText=document.getElementById("questionText");

const roundArea=document.getElementById("roundArea");

const speaker=document.getElementById("speaker");

const clap=document.getElementById("clap");

const wrong=document.getElementById("wrong");

const message=document.getElementById("message");

const finishScreen=document.getElementById("finishScreen");

const playAgain=document.getElementById("playAgain");

const svg=document.getElementById("lineLayer");


let round=1;

let speaking=false;

let voiceReady=false;


/*=========================================================
QUESTIONS
=========================================================*/

const questions=[

"Tap on the shape that is divided into halves.",

"Tap the picture and then tap its matching half.",

"Tap on the orange that is divided into halves."

];


/*=========================================================
WAIT FOR LOGO
=========================================================*/

window.onload=()=>{

setTimeout(()=>{

logo.style.display="none";

titleScreen.style.display="flex";

},5000);

};


/*=========================================================
START GAME
=========================================================*/

startBtn.onclick=()=>{

introScreen.style.display="none";

game.style.display="flex";

round=1;

loadRound();

};


/*=========================================================
VOICE
=========================================================*/

function speak(text){

window.speechSynthesis.cancel();

const utter=new SpeechSynthesisUtterance(text);

utter.rate=.9;

utter.pitch=1;

utter.volume=1;

const voices=window.speechSynthesis.getVoices();

if(voices.length>0){

utter.voice=voices.find(v=>v.lang.startsWith("en"))||voices[0];

}

window.speechSynthesis.speak(utter);

}


window.speechSynthesis.onvoiceschanged=()=>{

voiceReady=true;

};


/*=========================================================
SPEAKER BUTTON
=========================================================*/

speaker.onclick=()=>{

speak(questions[round-1]);

};


/*=========================================================
GOOD JOB
=========================================================*/

function showGoodJob(){

message.style.display="block";

clap.currentTime=0;

clap.play();

setTimeout(()=>{

message.style.display="none";

},1200);

}


/*=========================================================
WRONG ANSWER
=========================================================*/

function wrongAnswer(card){

wrong.currentTime=0;

wrong.play();

card.classList.add("wrong");

setTimeout(()=>{

card.classList.remove("wrong");

},400);

}


/*=========================================================
NEXT ROUND
=========================================================*/

function nextRound(){

round++;

setTimeout(()=>{

loadRound();

},1300);

}


/*=========================================================
LOAD ROUND
=========================================================*/

function loadRound(){

svg.innerHTML="";

roundArea.innerHTML="";

questionText.innerHTML=questions[round-1];

speak(questions[round-1]);

switch(round){

case 1:

loadRound1();

break;

case 2:

loadRound2();

break;

case 3:

loadRound3();

break;

default:

finishGame();

}

}


/*=========================================================
HELPER
=========================================================*/

function createCard(image){

const div=document.createElement("div");

div.className="card";

const img=document.createElement("img");

img.src="assets/"+image;

div.appendChild(img);

return div;

}

/*=========================================================
ROUND 1
=========================================================*/

function loadRound1(){

roundArea.innerHTML="";

roundArea.style.display="flex";
roundArea.style.justifyContent="space-evenly";
roundArea.style.alignItems="center";
roundArea.style.height="72vh";    
roundArea.style.gap="2vw";
roundArea.style.flexWrap="nowrap";

const images=[

"square.png",
"square2.png",
"square1.png"

];

const correct="square2.png";

images.forEach(name=>{

const card=createCard(name);

card.style.width="28vw";
card.style.maxWidth="240px";
card.style.height="28vw";
card.style.maxHeight="240px";

card.querySelector("img").style.width="100%";
card.querySelector("img").style.height="100%";
card.querySelector("img").style.objectFit="contain";

card.onclick=()=>{

if(name===correct){

card.classList.add("correct");

showGoodJob();

setTimeout(()=>{

nextRound();

},1200);

}

else{

wrongAnswer(card);

}

};

roundArea.appendChild(card);

});

}  

/*=========================================================
ROUND 2 VARIABLES
=========================================================*/

const leftItems=[
{id:"apple",img:"apple1.png"},
{id:"bread",img:"bread1.png"},
{id:"lemon",img:"lemon1.png"},
{id:"soap",img:"soap1.png"}
];

const rightItems=[
{id:"lemon",img:"lemon2.png"},
{id:"soap",img:"soap2.png"},
{id:"apple",img:"apple2.png"},
{id:"bread",img:"bread2.png"}
];

let selectedLeft=null;
let matched=0;
let matchedIds=[];


/*=========================================================
ROUND 2
=========================================================*/

function loadRound2(){

matched=0;
matchedIds=[];
selectedLeft=null;

svg.innerHTML="";
roundArea.innerHTML="";

roundArea.style.display="flex";
roundArea.style.justifyContent="space-evenly";
roundArea.style.alignItems="center";
roundArea.style.gap="8vw";

const leftColumn=document.createElement("div");
const rightColumn=document.createElement("div");

leftColumn.style.display="flex";
rightColumn.style.display="flex";

leftColumn.style.flexDirection="column";
rightColumn.style.flexDirection="column";

leftColumn.style.gap="1.2vh";
rightColumn.style.gap="1.2vh";

roundArea.appendChild(leftColumn);
roundArea.appendChild(rightColumn);


/*-----------------------
LEFT SIDE
-----------------------*/

leftItems.forEach(item=>{

const card=createCard(item.img);

card.dataset.id=item.id;

card.dataset.side="left";

card.style.width="18vw";
card.style.maxWidth="130px";
card.style.height="14vh";
card.style.maxHeight="90px";

card.onclick=()=>selectLeft(card);

leftColumn.appendChild(card);

});


/*-----------------------
RIGHT SIDE
-----------------------*/

rightItems.forEach(item=>{

const card=createCard(item.img);

card.dataset.id=item.id;

card.dataset.side="right";

card.style.width="18vw";
card.style.maxWidth="130px";
card.style.height="14vh";
card.style.maxHeight="90px";

card.onclick=()=>selectRight(card);

rightColumn.appendChild(card);

});

}

/*=========================================================
ROUND 2 MATCHING
=========================================================*/

function selectLeft(card){

if(card.classList.contains("matched")) return;

document.querySelectorAll('[data-side="left"]').forEach(c=>{
    if(!c.classList.contains("matched")){
        c.style.borderColor="#6A1B9A";
    }
});

selectedLeft=card;
card.style.borderColor="#2196F3";

}


function selectRight(card){

if(!selectedLeft) return;

if(card.classList.contains("matched")) return;


/*------------------------
CORRECT MATCH
-------------------------*/

if(selectedLeft.dataset.id===card.dataset.id){

selectedLeft.classList.add("matched","correct");
card.classList.add("matched","correct");

drawMatchLine(selectedLeft,card);

matched++;

selectedLeft=null;

if(matched===4){

showGoodJob();

setTimeout(()=>{

nextRound();

},1400);

}

}

/*------------------------
WRONG MATCH
-------------------------*/

else{

wrongAnswer(card);

wrongAnswer(selectedLeft);

selectedLeft.style.borderColor="#6A1B9A";

selectedLeft=null;

}

}


/*=========================================================
DRAW GREEN LINE
=========================================================*/

function drawMatchLine(leftCard,rightCard){

const svgRect=svg.getBoundingClientRect();

const leftRect=leftCard.getBoundingClientRect();

const rightRect=rightCard.getBoundingClientRect();

const x1=leftRect.right-svgRect.left;

const y1=leftRect.top+leftRect.height/2-svgRect.top;

const x2=rightRect.left-svgRect.left;

const y2=rightRect.top+rightRect.height/2-svgRect.top;

const line=document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.setAttribute("x1",x1);
line.setAttribute("y1",y1);

line.setAttribute("x2",x2);
line.setAttribute("y2",y2);

line.setAttribute("stroke","#4CAF50");

line.setAttribute("stroke-width","8");

line.setAttribute("stroke-linecap","round");

svg.appendChild(line);

}


/*=========================================================
REDRAW LINES AFTER RESIZE
=========================================================*/

window.addEventListener("resize",()=>{

if(round!==2) return;

svg.innerHTML="";

document.querySelectorAll(".matched[data-side='left']").forEach(left=>{

const id=left.dataset.id;

const right=document.querySelector(
".matched[data-side='right'][data-id='"+id+"']"
);

if(right){

drawMatchLine(left,right);

}

});

});

/*=========================================================
ROUND 3
=========================================================*/

function loadRound3(){

svg.innerHTML="";
roundArea.innerHTML="";

roundArea.style.display="flex";
roundArea.style.justifyContent="space-evenly";
roundArea.style.alignItems="center";
roundArea.style.gap="2vw";

const images=[
"orange1.png",
"orange2.png",
"orange.png"
];

const correct="orange1.png";

images.forEach(name=>{

const card=createCard(name);

card.style.width="28vw";
card.style.maxWidth="240px";
card.style.height="28vw";
card.style.maxHeight="240px";

const img=card.querySelector("img");

img.style.width="100%";
img.style.height="100%";
img.style.objectFit="contain";

card.onclick=()=>{

if(name===correct){

card.classList.add("correct");

showGoodJob();

setTimeout(()=>{

finishGame();

},1300);

}

else{

wrongAnswer(card);

}

};

roundArea.appendChild(card);

});

}


/*=========================================================
FINISH GAME
=========================================================*/

function finishGame(){

game.style.display="none";

startConfetti();

setTimeout(()=>{

finishScreen.style.display="flex";

},300);

}


/*=========================================================
PLAY AGAIN
=========================================================*/

playAgain.onclick=()=>{

window.speechSynthesis.cancel();

finishScreen.style.display="none";

game.style.display="none";

introScreen.style.display="flex";

titleScreen.style.display="none";

logo.style.display="block";

logo.style.animation="none";
void logo.offsetWidth;
logo.style.animation="fadeLogo 5s forwards";

round=1;

setTimeout(()=>{

logo.style.display="none";

titleScreen.style.display="flex";

},5000);

}

/*=========================================================
CONFETTI
=========================================================*/

const canvas=document.getElementById("confettiCanvas");
const ctx=canvas.getContext("2d");

let confetti=[];
let confettiAnimation=null;

function resizeCanvas(){

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

}

resizeCanvas();

window.addEventListener("resize",resizeCanvas);

function startConfetti(){

resizeCanvas();

confetti=[];

const colours=[
"#F44336",
"#FF9800",
"#FFD54F",
"#4CAF50",
"#29B6F6",
"#AB47BC",
"#EC407A"
];

for(let i=0;i<350;i++){

confetti.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height-canvas.height,

w:12+Math.random()*14,

h:16+Math.random()*18,

vy:4+Math.random()*5,

vx:-1+Math.random()*2,

rot:Math.random()*360,

vr:-4+Math.random()*8,

colour:colours[Math.floor(Math.random()*colours.length)]

});

}

cancelAnimationFrame(confettiAnimation);

animateConfetti();

setTimeout(()=>{

cancelAnimationFrame(confettiAnimation);

ctx.clearRect(0,0,canvas.width,canvas.height);

},7000);

}


function animateConfetti(){

ctx.clearRect(0,0,canvas.width,canvas.height);

confetti.forEach(c=>{

ctx.save();

ctx.translate(c.x,c.y);

ctx.rotate(c.rot*Math.PI/180);

ctx.fillStyle=c.colour;

ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);

ctx.restore();

c.x+=c.vx;

c.y+=c.vy;

c.rot+=c.vr;

});

confettiAnimation=requestAnimationFrame(animateConfetti);

}



/*=========================================================
ENABLE AUDIO ON FIRST TAP
=========================================================*/

document.body.addEventListener("pointerdown",()=>{

clap.load();
wrong.load();

},{once:true});


/*=========================================================
STOP SPEECH WHEN LEAVING PAGE
=========================================================*/

window.addEventListener("beforeunload",()=>{

window.speechSynthesis.cancel();

});  
  
</script>

</body>
</html>
