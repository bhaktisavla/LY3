<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counting Game</title>

<style>
body {
    margin: 0;
    font-family: 'Comic Sans MS', sans-serif;
    background: #f5fbff;
    text-align: center;
}

/* SPLASH */
#splash {
    position: fixed;
    width: 100%;
    height: 100%;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
}
#splash img { width: 180px; }

/* GAME */
#game {
    display: none;
    padding: 10px;
}

h2 {
    color: #ff7043;
    margin: 5px;
}

/* GRID FOR EASY COUNTING */
#objects {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    justify-items: center;
    margin: 10px 0;
}

/* BIG CLEAR IMAGES */
#objects img {
    width: 60px;
    height: 60px;
}

/* BIG INPUT */
input {
    width: 160px;
    height: 65px;
    font-size: 30px;
    text-align: center;
    border-radius: 12px;
    border: 2px solid #ccc;
}

/* BUTTONS */
button {
    margin-top: 8px;
    padding: 10px 18px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    background: #4CAF50;
    color: white;
}

#playAgain {
    display: none;
    background: #ff7043;
}

/* MOBILE OPTIMIZATION */
@media (max-width: 600px) {
    #objects img {
        width: 50px;
        height: 50px;
    }

    input {
        width: 140px;
        height: 60px;
        font-size: 26px;
    }
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
    <img src="assets/innovine-logo.png">
</div>

<!-- GAME -->
<div id="game">
    <h2>Count and type the number</h2>

    <div id="objects"></div>

    <input type="number" id="answer" placeholder="?">
    <br>

    <button onclick="checkAnswer()">Submit</button>

    <div id="feedback"></div>

    <button id="playAgain" onclick="startGame()">🔁 Play Again</button>
</div>

<!-- AUDIO -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="greatSound" src="assets/greatjob.mp3"></audio>
<audio id="voicePlayer"></audio>

<script>
let currentQuestion = 0;
let numbers = [];
let correctAnswer = 0;

// YOUR OBJECTS
const objects = [
"assets/cat.png",
"assets/book.png",
"assets/dog.png",
"assets/sun.png",
"assets/bag.png",
"assets/star.png",
"assets/moon.png",
"assets/crayon.png",
"assets/bus.png",
"assets/bird.png"
];

// SPLASH 5 sec
setTimeout(() => {
    document.getElementById("splash").style.display = "none";
    document.getElementById("game").style.display = "block";
    startGame();
}, 5000);

// shuffle
function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

// numbers
function generateNumbers() {
    let pool = [];
    for (let i = 1; i <= 30; i++) pool.push(i);
    shuffle(pool);
    numbers = pool.slice(0, 10);
}

// START
function startGame() {
    generateNumbers();
    currentQuestion = 0;
    document.getElementById("playAgain").style.display = "none";
    nextQuestion();
}

// NEXT
function nextQuestion() {
    if (currentQuestion >= 10) {
        endGame();
        return;
    }

    correctAnswer = numbers[currentQuestion];

    document.getElementById("answer").value = "";
    document.getElementById("feedback").innerText = "";

    let container = document.getElementById("objects");
    container.innerHTML = "";

    let imgSrc = objects[currentQuestion];

    for (let i = 0; i < correctAnswer; i++) {
        let img = document.createElement("img");
        img.src = imgSrc;
        container.appendChild(img);
    }

    // VOICE AUTO PLAY
    let voice = document.getElementById("voicePlayer");
    voice.src = "assets/voice/q" + (currentQuestion + 1) + ".mp3";
    voice.play();

    currentQuestion++;
}

// CHECK
function checkAnswer() {
    let user = Number(document.getElementById("answer").value);

    if (user === correctAnswer) {
        document.getElementById("feedback").innerText = "✅ Correct";
        document.getElementById("correctSound").play();
        setTimeout(nextQuestion, 1000);
    } else {
        document.getElementById("feedback").innerText = "❌ Try Again";
    }
}

// END
function endGame() {
    document.getElementById("objects").innerHTML = "🎉 FINISH 🎉";
    document.getElementById("greatSound").play();
    document.getElementById("playAgain").style.display = "inline-block";
}
</script>

</body>
</html>
