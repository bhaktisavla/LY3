<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Count and Type</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#FFF4DC;
text-align:center;
overflow-x:hidden;
}

#splash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
}

#splash img{
width:250px;
max-width:80%;
}

.container{
padding:10px;
max-width:900px;
margin:auto;
}

.card{
background:white;
padding:15px;
border-radius:20px;
box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

h1{
color:#F26B38;
font-size:24px;
margin-top:5px;
}

.question{
font-size:22px;
font-weight:bold;
margin:10px 0;
}

.progress{
font-size:18px;
margin-bottom:10px;
}

.objects{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(45px,1fr));
gap:8px;
justify-items:center;
margin:15px auto;
max-width:700px;
}

.objects img{
width:45px;
height:45px;
object-fit:contain;
}

.controls{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

input{
width:140px;
height:65px;
font-size:34px;
text-align:center;
border-radius:18px;
border:4px solid #444;
}

button{
padding:14px 20px;
font-size:20px;
border:none;
border-radius:15px;
background:#5DBB63;
color:white;
font-weight:bold;
cursor:pointer;
}

.hearBtn{
background:#6A8DFF;
}

.feedback{
height:35px;
font-size:24px;
font-weight:bold;
margin-top:10px;
}

#finishScreen{
display:none;
}

@media(max-width:480px){

h1{
font-size:22px;
}

.question{
font-size:18px;
}

.objects{
grid-template-columns:repeat(auto-fit,minmax(35px,1fr));
}

.objects img{
width:35px;
height:35px;
}

input{
width:120px;
height:60px;
font-size:30px;
}

button{
font-size:18px;
padding:12px 18px;
}

}

</style>

</head>

<body>

<div id="splash">
<img src="./assets/innovine-logo.png">
</div>

<div class="container" id="game" style="display:none;">

<div class="card" id="gameCard">

<h1>Count and Type the Number</h1>

<div class="progress" id="progress"></div>

<div class="question" id="question"></div>

<button class="hearBtn" onclick="speakQuestion()">🔊 Hear Again</button>

<div class="objects" id="objects"></div>

<div class="controls">

<input
id="answer"
type="number"
inputmode="numeric"
pattern="[0-9]*"
min="1"
max="30"
>

<button onclick="checkAnswer()">Submit</button>

</div>

<div class="feedback" id="feedback"></div>

</div>

<div class="card" id="finishScreen">

<h2>🎉 Great Job! 🎉</h2>

<p>You finished all 10 questions.</p>

<button onclick="restartGame()">Play Again</button>

</div>

</div>

<audio id="correctSound" src="./assets/correct.mp3"></audio>

<audio id="wrongSound" src="./assets/wrong.mp3"></audio>

<audio id="clapSound" src="./assets/freesound_community-claps-44774.mp3"></audio>

<script>

const items = [

{
name:"bags",
image:"./assets/bag.png"
},

{
name:"birds",
image:"./assets/bird.jpg"
},

{
name:"books",
image:"./assets/book.png"
},

{
name:"buses",
image:"./assets/bus.png"
},

{
name:"cats",
image:"./assets/cat.jpg"
},

{
name:"crayons",
image:"./assets/crayon.jpg"
},

{
name:"dogs",
image:"./assets/dog.png"
},

{
name:"moons",
image:"./assets/moon.png"
},

{
name:"stars",
image:"./assets/star.png"
},

{
name:"suns",
image:"./assets/sun.jpg"
}

];

let questions = [];
let currentQuestion = 0;

window.onload = function(){

setTimeout(function(){

document.getElementById("splash").style.display="none";

document.getElementById("game").style.display="block";

startGame();

},5000);

};

function startGame(){

questions=[];

currentQuestion=0;

let used={};

while(questions.length<10){

let randomNumber=Math.floor(Math.random()*30)+1;

if(!used[randomNumber]){

used[randomNumber]=true;

questions.push({

count:randomNumber,

item:items[questions.length]

});

}

}

showQuestion();

}

function showQuestion(){

let q=questions[currentQuestion];

document.getElementById("progress").innerHTML=
"Question "+(currentQuestion+1)+" of 10";

document.getElementById("question").innerHTML=
"How many "+q.item.name+" do you see?";

document.getElementById("answer").value="";

document.getElementById("feedback").innerHTML="";

let objects=document.getElementById("objects");

objects.innerHTML="";

for(let i=0;i<q.count;i++){

let img=document.createElement("img");

img.src=q.item.image;

img.alt=q.item.name;

objects.appendChild(img);

}

setTimeout(function(){

speakQuestion();

},500);

}

function speakQuestion(){

let q=questions[currentQuestion];

if('speechSynthesis' in window){

speechSynthesis.cancel();

let speech=new SpeechSynthesisUtterance(

"How many "+q.item.name+" do you see? Count and type the number."

);

speech.rate=0.85;

speech.pitch=1;

speechSynthesis.speak(speech);

}

}

function checkAnswer(){

let answer=Number(document.getElementById("answer").value);

let correct=questions[currentQuestion].count;

if(answer===correct){

document.getElementById("feedback").innerHTML="✅ Correct!";

playSound("correctSound");

setTimeout(function(){

currentQuestion++;

if(currentQuestion>=10){

finishGame();

}else{

showQuestion();

}

},1000);

}else{

document.getElementById("feedback").innerHTML="❌ Try Again";

playSound("wrongSound");

speakText("Try again. Count carefully.");

}

}

function finishGame(){

document.getElementById("gameCard").style.display="none";

document.getElementById("finishScreen").style.display="block";

playSound("clapSound");

speakText("Great Job! You finished the game.");

}

function restartGame(){

document.getElementById("finishScreen").style.display="none";

document.getElementById("gameCard").style.display="block";

startGame();

}

function playSound(id){

let sound=document.getElementById(id);

sound.currentTime=0;

sound.play();

}

function speakText(text){

if('speechSynthesis' in window){

speechSynthesis.cancel();

let speech=new SpeechSynthesisUtterance(text);

speech.rate=0.85;

speechSynthesis.speak(speech);

}

}

</script>

</body>
</html>
