<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counting Game</title>

<style>
body {
    margin: 0;
    font-family: 'Comic Sans MS', sans-serif;
    text-align: center;
    background: #f5fbff;
}

/* SPLASH */
#splash {
    position: fixed;
    width: 100%;
    height: 100%;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

#splash img {
    width: 180px;
}

/* GAME */
#game {
    display: none;
    padding: 10px;
}

h2 {
    color: #ff7043;
    margin: 5px;
}

#objects {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 10px 0;
}

#objects img {
    width: 45px;
    height: 45px;
}

input {
    width: 140px;
    height: 60px;
    font-size: 28px;
    text-align: center;
    border-radius: 12px;
    border: 2px solid #ccc;
}

button {
    margin: 5px;
    padding: 10px 15px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    background: #4CAF50;
    color: white;
}

#playAgain {
    display: none;
    background: #ff7043;
}

/* MOBILE */
@media (max-width: 600px) {
    #objects img {
        width: 38px;
        height: 38px;
    }
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
</div>

<!-- GAME -->
<div id="game">
    <h2 id="question"></h2>

    <div id="objects"></div>

    <input type="number" id="answer" placeholder="?">
    <br>

    <button onclick="checkAnswer()">Submit</button>

    <div id="feedback"></div>

    <button id="playAgain" onclick="startGame()">🔁 Play Again</button>
</div>

<!-- SOUNDS -->
<audio id="correctSound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_7d6c0a7b3c.mp3"></audio>
<audio id="greatSound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_c9a4a0c8f2.mp3"></audio>

<script>
let currentQuestion = 0;
let numbers = [];
let correctAnswer = 0;

// CHILD-FRIENDLY CLEAR IMAGES
const objects = [
"https://cdn-icons-png.flaticon.com/512/616/616408.png", // dog
"https://cdn-icons-png.flaticon.com/512/1998/1998610.png", // bird
"https://cdn-icons-png.flaticon.com/512/2909/2909763.png", // flower
"https://cdn-icons-png.flaticon.com/512/427/427735.png", // tree
"https://cdn-icons-png.flaticon.com/512/833/833472.png", // star
"https://cdn-icons-png.flaticon.com/512/1046/1046784.png", // ball
"https://cdn-icons-png.flaticon.com/512/3145/3145765.png", // books
"https://cdn-icons-png.flaticon.com/512/2936/2936886.png", // butterfly
"https://cdn-icons-png.flaticon.com/512/1048/1048953.png", // school bag
"https://cdn-icons-png.flaticon.com/512/766/766020.png"  // capsicum
];

// shuffle
function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

// numbers
function generateNumbers() {
    let pool = [];
    for (let i = 1; i <= 30; i++) pool.push(i);
    shuffle(pool);
    numbers = pool.slice(0, 10);
}

// SPLASH 5 sec
setTimeout(() => {
    document.getElementById("splash").style.display = "none";
    document.getElementById("game").style.display = "block";
    startGame();
}, 5000);

// START
function startGame() {
    generateNumbers();
    currentQuestion = 0;
    document.getElementById("playAgain").style.display = "none";
    nextQuestion();
}

// NEXT
function nextQuestion() {
    if (currentQuestion >= 10) {
        endGame();
        return;
    }

    correctAnswer = numbers[currentQuestion];

    document.getElementById("question").innerText =
        "Count and type the number";

    document.getElementById("answer").value = "";
    document.getElementById("feedback").innerText = "";

    let container = document.getElementById("objects");
    container.innerHTML = "";

    let imgSrc = objects[currentQuestion];

    for (let i = 0; i < correctAnswer; i++) {
        let img = document.createElement("img");
        img.src = imgSrc;
        container.appendChild(img);
    }

    currentQuestion++;
}

// CHECK
function checkAnswer() {
    let user = Number(document.getElementById("answer").value);

    if (user === correctAnswer) {
        document.getElementById("feedback").innerText = "✅ Correct";
        document.getElementById("correctSound").play();
        setTimeout(nextQuestion, 1000);
    } else {
        document.getElementById("feedback").innerText = "❌ Try Again";
    }
}

// END
function endGame() {
    document.getElementById("objects").innerHTML = "🎉 FINISH 🎉";
    document.getElementById("greatSound").play();
    document.getElementById("playAgain").style.display = "inline-block";
}
</script>

</body>
</html>
