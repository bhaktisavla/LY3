<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Skip Counting</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:'Trebuchet MS',sans-serif;
}

body{
background:linear-gradient(135deg,#fff3b0,#bde0fe,#caffbf,#ffd6a5);
background-size:400% 400%;
animation:bgMove 15s ease infinite;
position:relative;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.bg-circle{
position:absolute;
border-radius:50%;
opacity:.25;
animation:float 12s linear infinite;
}

.bg1{
width:120px;
height:120px;
background:#ffadad;
left:5%;
top:10%;
}

.bg2{
width:150px;
height:150px;
background:#caffbf;
right:8%;
top:20%;
}

.bg3{
width:100px;
height:100px;
background:#a0c4ff;
left:15%;
bottom:10%;
}

.bg4{
width:140px;
height:140px;
background:#ffd6a5;
right:15%;
bottom:8%;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-25px);}
}

.screen{
position:absolute;
inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
padding:10px;
}

.active{
display:flex;
}

#logoScreen img{
width:min(300px,70vw);
}

#titleScreen h1{
font-size:clamp(2rem,6vw,4rem);
font-weight:900;
text-align:center;
background:linear-gradient(90deg,#ff6b6b,#ffb703,#4dabf7,#51cf66,#ff6b6b);
background-size:300% 100%;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:rainbow 3s linear infinite;
margin-bottom:25px;
}

@keyframes rainbow{
0%{background-position:0%;}
100%{background-position:300%;}
}

#startBtn{
padding:16px 40px;
font-size:clamp(1.1rem,3vw,1.6rem);
border:none;
border-radius:50px;
background:#ffb703;
color:#222;
font-weight:900;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

#startBtn:active{
transform:scale(.95);
}

.gameTitle{
font-size:clamp(1.5rem,4vw,2.4rem);
font-weight:900;
color:#0a6fae;
margin-bottom:10px;
text-align:center;
}

.question{
background:#bde0fe;
padding:10px 18px;
border-radius:12px;
font-size:clamp(.9rem,2.2vw,1.3rem);
font-weight:700;
text-align:center;
max-width:900px;
margin-bottom:10px;
}

.hearBtn{
border:none;
background:#51cf66;
color:white;
padding:10px 18px;
border-radius:25px;
font-weight:bold;
margin-bottom:15px;
cursor:pointer;
}

.boardWrap{
position:relative;
width:min(720px,90vw);
}

.board{
width:100%;
display:block;
}

.boardNumbers{
position:absolute;
inset:0;
display:flex;
justify-content:space-around;
align-items:center;
font-size:clamp(2rem,6vw,4rem);
font-weight:900;
color:black;
text-shadow:1px 1px 0 white;
}

.options{
display:flex;
justify-content:center;
gap:25px;
margin-top:30px;
width:100%;
}

.option{
position:relative;
cursor:pointer;
width:min(170px,26vw);
}

.option img{
width:100%;
display:block;
}

.option span{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:center;
font-size:clamp(2rem,5vw,3.5rem);
font-weight:900;
color:white;
}

.correct{
border:6px solid #39d353;
border-radius:30px;
}

.glow{
animation:glow 1s infinite;
}

@keyframes glow{
0%,100%{
filter:drop-shadow(0 0 5px gold);
}
50%{
filter:drop-shadow(0 0 20px gold);
}
}

.wiggle{
animation:wiggle .4s;
}

@keyframes wiggle{
0%,100%{transform:translateX(0);}
25%{transform:translateX(-10px);}
75%{transform:translateX(10px);}
}

#goodJob{
position:absolute;
inset:0;
display:none;
justify-content:center;
align-items:center;
font-size:clamp(2rem,6vw,4rem);
font-weight:900;
background:rgba(255,255,255,.8);
color:#ff7b00;
z-index:50;
}

#finishScreen h1{
font-size:clamp(2.5rem,7vw,5rem);
color:#ff7b00;
text-align:center;
margin-bottom:25px;
}

#playAgain{
padding:15px 35px;
border:none;
border-radius:40px;
font-size:1.2rem;
font-weight:900;
background:#51cf66;
color:white;
cursor:pointer;
}

canvas{
position:absolute;
inset:0;
pointer-events:none;
}

@media (max-width:768px){

.options{
gap:10px;
}

.option{
width:30vw;
}

.boardWrap{
width:95vw;
}

}
</style>
</head>
<body>

<div class="bg-circle bg1"></div>
<div class="bg-circle bg2"></div>
<div class="bg-circle bg3"></div>
<div class="bg-circle bg4"></div>

<audio id="clap" src="assets/clap.mp3"></audio>
<audio id="wrong" src="assets/wrong.mp3"></audio>

<div id="logoScreen" class="screen active">
<img src="assets/innovine-logo.png">
</div>

<div id="titleScreen" class="screen">
<h1>SKIP COUNTING </h1>
<button id="startBtn">👆 TAP TO START</button>
</div>

<div id="gameScreen" class="screen">

<h2 class="gameTitle">Skip Counting by 2</h2>

<div id="questionText" class="question">
Skip count by 2. Read the numbers and tap the number that comes next in the sequence.
</div>

<button class="hearBtn" id="hearAgain">
🔊 Hear Again
</button>

<div class="boardWrap">
<img src="assets/questionboard.png" class="board">

<div class="boardNumbers">
<span id="num1"></span>
<span id="num2"></span>
<span>?</span>
</div>
</div>

<div class="options" id="options"></div>

</div>

<div id="goodJob">
⭐ GOOD JOB ⭐
</div>

<div id="finishScreen" class="screen">
<h1>🎉 GREAT JOB! 🎉</h1>
<button id="playAgain">Play Again</button>
</div>

<canvas id="confetti"></canvas>
<script>

const rounds = [
{
title:"Skip Counting by 2",
nums:[2,4],
options:[
{img:"assets/blue.png",value:8},
{img:"assets/orange.png",value:6},
{img:"assets/pink.png",value:10}
],
answer:6
},
{
title:"Skip Counting by 2",
nums:[4,6],
options:[
{img:"assets/blue.png",value:8},
{img:"assets/orange.png",value:2},
{img:"assets/pink.png",value:10}
],
answer:8
},
{
title:"Skip Counting by 2",
nums:[10,12],
options:[
{img:"assets/blue.png",value:8},
{img:"assets/orange.png",value:14},
{img:"assets/pink.png",value:16}
],
answer:14
},
{
title:"Skip Counting by 2",
nums:[16,18],
options:[
{img:"assets/blue.png",value:14},
{img:"assets/orange.png",value:19},
{img:"assets/pink.png",value:20}
],
answer:20
}
];

let currentRound=0;
let wrongAttempts=0;

const logoScreen=document.getElementById("logoScreen");
const titleScreen=document.getElementById("titleScreen");
const gameScreen=document.getElementById("gameScreen");
const finishScreen=document.getElementById("finishScreen");
const goodJob=document.getElementById("goodJob");

const num1=document.getElementById("num1");
const num2=document.getElementById("num2");
const optionsDiv=document.getElementById("options");

const clap=document.getElementById("clap");
const wrong=document.getElementById("wrong");

const narrationText=
"Skip count by 2. Read the numbers and tap the number that comes next in the sequence.";

function showScreen(screen){
document.querySelectorAll(".screen").forEach(s=>{
s.classList.remove("active");
});
screen.classList.add("active");
}

setTimeout(()=>{
showScreen(titleScreen);
},5000);

document.getElementById("startBtn").addEventListener("click",()=>{
showScreen(gameScreen);
loadRound();
});

document.getElementById("hearAgain").addEventListener("click",()=>{
speakQuestion();
});

function speakQuestion(){

speechSynthesis.cancel();

const speech=new SpeechSynthesisUtterance(narrationText);

speech.rate=0.9;
speech.pitch=1.05;
speech.volume=1;

speechSynthesis.speak(speech);
}

function loadRound(){

wrongAttempts=0;

const round=rounds[currentRound];

document.querySelector(".gameTitle").textContent=round.title;

num1.textContent=round.nums[0];
num2.textContent=round.nums[1];

optionsDiv.innerHTML="";

round.options.forEach(option=>{

const div=document.createElement("div");
div.className="option";

div.innerHTML=`
<img src="${option.img}">
<span>${option.value}</span>
`;

div.addEventListener("click",()=>checkAnswer(div,option.value));

optionsDiv.appendChild(div);

});

setTimeout(()=>{
speakQuestion();
},300);
}

function checkAnswer(element,value){

const round=rounds[currentRound];

if(value===round.answer){

element.classList.add("correct");

clap.currentTime=0;
clap.play();

goodJob.style.display="flex";

setTimeout(()=>{

goodJob.style.display="none";

currentRound++;

if(currentRound>=rounds.length){

showFinish();

}else{

loadRound();

}

},1800);

}else{

wrong.currentTime=0;
wrong.play();

element.classList.add("wiggle");

setTimeout(()=>{
element.classList.remove("wiggle");
},400);

wrongAttempts++;

if(wrongAttempts>=2){

document.querySelectorAll(".option").forEach(opt=>{

const number=opt.querySelector("span").textContent;

if(Number(number)===round.answer){

opt.classList.add("glow");

}

});

}

}

}

function showFinish(){

showScreen(finishScreen);

clap.currentTime=0;
clap.play();

startConfetti();

}

document.getElementById("playAgain").addEventListener("click",()=>{

currentRound=0;

stopConfetti();

showScreen(gameScreen);

loadRound();

});

/* ---------- CONFETTI ---------- */

const canvas=document.getElementById("confetti");
const ctx=canvas.getContext("2d");

let pieces=[];
let confettiRunning=false;

function resizeCanvas(){

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

}

window.addEventListener("resize",resizeCanvas);
resizeCanvas();

function startConfetti(){

confettiRunning=true;

pieces=[];

for(let i=0;i<180;i++){

pieces.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height-canvas.height,
r:Math.random()*8+4,
vx:(Math.random()-0.5)*4,
vy:Math.random()*3+2,
rot:Math.random()*360

});

}

animateConfetti();

}

function animateConfetti(){

if(!confettiRunning)return;

ctx.clearRect(0,0,canvas.width,canvas.height);

const colors=[
"#ff6b6b",
"#ffd43b",
"#4dabf7",
"#69db7c",
"#f783ac",
"#ff922b"
];

pieces.forEach(p=>{

p.x+=p.vx;
p.y+=p.vy;
p.rot+=4;

ctx.save();

ctx.translate(p.x,p.y);
ctx.rotate(p.rot*Math.PI/180);

ctx.fillStyle=colors[Math.floor(Math.random()*colors.length)];

ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r);

ctx.restore();

if(p.y>canvas.height){

p.y=-20;

}

});

requestAnimationFrame(animateConfetti);

}

function stopConfetti(){

confettiRunning=false;
ctx.clearRect(0,0,canvas.width,canvas.height);

}

</script>

</body>
</html>
