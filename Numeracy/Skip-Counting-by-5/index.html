<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Skip Counting</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(to bottom,
#87ceeb 0%,
#b7e4d4 60%,
#f7e8a3 100%);
position:relative;
}

/* Decorative hills */

body::before{
content:"";
position:absolute;
left:-10%;
bottom:-10%;
width:45%;
height:25%;
background:#f5da3a;
border-radius:50%;
z-index:0;
}

body::after{
content:"";
position:absolute;
right:-10%;
bottom:-10%;
width:40%;
height:28%;
background:#f05cab;
border-radius:50%;
z-index:0;
}

#purpleHill{
position:absolute;
bottom:-10%;
left:25%;
width:50%;
height:20%;
background:#8656f0;
border-radius:50%;
z-index:0;
}

.screen{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:2;
}

.hidden{
display:none;
}

/* LOGO */

#logoScreen img{
width:min(320px,70vw);
}

/* TITLE SCREEN */

#titleScreen{
gap:30px;
}

#mainTitle{
font-size:clamp(42px,6vw,80px);
font-weight:900;
background:linear-gradient(
90deg,
#ff5c8a,
#ff9f43,
#ffd93d,
#36c85a,
#4d96ff,
#9b59ff
);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:titleFloat 2s infinite ease-in-out;
text-align:center;
text-shadow:0 0 5px rgba(255,255,255,.6);
}

@keyframes titleFloat{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-8px);}
}

#startBtn{
padding:18px 60px;
font-size:clamp(22px,3vw,34px);
font-weight:900;
border:none;
border-radius:50px;
background:#36c85a;
color:white;
cursor:pointer;
box-shadow:0 10px 25px rgba(0,0,0,.18);
animation:startPulse 2s infinite ease-in-out;
}

@keyframes startPulse{
0%,100%{
transform:scale(1);
}

50%{
transform:scale(1.08);
box-shadow:0 0 30px rgba(54,200,90,.5);
}
}

/* GAME */

#gameScreen{
padding:10px;
justify-content:flex-start;
}

#header{
font-size:clamp(24px,3vw,42px);
font-weight:900;
margin-top:10px;
text-align:center;
background:linear-gradient(
90deg,
#ff5c8a,
#ff9f43,
#ffd93d,
#36c85a,
#4d96ff,
#9b59ff
);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

#hearBtn{
position:absolute;
top:15px;
right:15px;
border:none;
background:#35c759;
color:white;
font-weight:bold;
padding:12px 22px;
border-radius:40px;
font-size:clamp(14px,2vw,22px);
cursor:pointer;
}

#questionBox{
width:min(90%,1300px);
margin-top:10px;
background:#efe6bf;
border:5px dashed #ff5ca0;
border-radius:25px;
padding:12px;
text-align:center;
font-weight:bold;
color:#2233aa;
font-size:clamp(14px,1.5vw,24px);
line-height:1.2;
}

#boardWrap{
display:flex;
justify-content:center;
margin-top:20px;
}

#customBoard{
width:min(82vw,850px);
height:90px;
background:#ffffff;
border:10px solid #ff4d94;
border-radius:35px;
display:flex;
justify-content:space-evenly;
align-items:center;
font-size:clamp(28px,4vw,55px);
font-weight:900;
color:black;
box-shadow:0 8px 25px rgba(0,0,0,.15);
}

#options{
display:flex;
gap:3vw;
justify-content:center;
align-items:center;
margin-top:8px;
}

.option{
position:relative;
width:min(24vw,180px);
cursor:pointer;
transition:.3s;
}

.option img{
width:100%;
display:block;
}

.option span{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
font-size:clamp(24px,4vw,52px);
font-weight:900;
color:#1b5e20;
}

.correct{
border:8px solid #32cd32;
border-radius:25px;
box-shadow:0 0 25px #32cd32;
}

.glow{
animation:glow 1s infinite;
}

@keyframes glow{
0%,100%{
transform:scale(1);
filter:drop-shadow(0 0 0 lime);
}
50%{
transform:scale(1.08);
filter:drop-shadow(0 0 20px lime);
}
}

.wiggle{
animation:wiggle .35s;
}

@keyframes wiggle{
0%{transform:translateX(0);}
25%{transform:translateX(-10px);}
50%{transform:translateX(10px);}
75%{transform:translateX(-10px);}
100%{transform:translateX(0);}
}

#feedback{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:center;
font-size:clamp(40px,8vw,90px);
font-weight:900;
background:rgba(255,255,255,.65);
color:#ff6f00;
z-index:50;
}

#endScreen{
gap:20px;
text-align:center;
}

#endTitle{
font-size:clamp(50px,8vw,110px);
font-weight:900;
background:linear-gradient(
90deg,
#ff5c8a,
#ff9f43,
#ffd93d,
#36c85a,
#4d96ff,
#9b59ff
);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

#playAgain{
padding:18px 50px;
border:none;
border-radius:50px;
background:#36c85a;
color:white;
font-size:clamp(22px,3vw,34px);
font-weight:bold;
cursor:pointer;
}

canvas{
position:absolute;
inset:0;
pointer-events:none;
z-index:100;
}

@media(max-width:768px){

#questionBox{
font-size:18px;
}

#options{
gap:12px;
}

.option{
width:28vw;
}

#header{
font-size:34px;
}

#customBoard{
height:120px;
font-size:40px;
}

.option span{
font-size:34px;
}
}

</style>

</head>
<body>

<div id="purpleHill"></div>

<audio id="clap" src="assets/clap.mp3"></audio> <audio id="wrong" src="assets/wrong.mp3"></audio>

<div id="logoScreen" class="screen">
<img src="assets/innovine-logo.png">
</div>

<div id="titleScreen" class="screen hidden">
<h1 id="mainTitle">Skip Counting</h1>
<button id="startBtn">TAP TO START</button>
</div>

<div id="gameScreen" class="screen hidden">

<button id="hearBtn">Hear Again</button>

<div id="header">Skip Counting by 5</div>

<div id="questionBox"></div>

<div id="boardWrap">
<div id="customBoard">
<span id="n1"></span>
<span id="n2"></span>
<span>?</span>
</div>
</div>

<div id="options"></div>

</div>

<div id="endScreen" class="screen hidden">
<div id="endTitle">Great Job!</div>
<button id="playAgain">PLAY AGAIN</button>
</div>

<canvas id="confetti"></canvas>

<script>
const rounds = [

{
title:"Skip Counting by 5",
question:"Skip count by 5. Tap the number that comes next in the sequence.",
numbers:[5,10],
options:[
{value:15,img:"assets/green.png"},
{value:19,img:"assets/purple.png"},
{value:20,img:"assets/pink.png"}
],
answer:15
},

{
title:"Skip Counting by 5",
question:"Skip count by 5. Tap the number that comes next in the sequence.",
numbers:[10,15],
options:[
{value:5,img:"assets/green.png"},
{value:0,img:"assets/purple.png"},
{value:20,img:"assets/pink.png"}
],
answer:20
},

{
title:"Skip Counting by 5",
question:"Skip count by 5. Tap the number that comes next in the sequence.",
numbers:[15,20],
options:[
{value:15,img:"assets/green.png"},
{value:25,img:"assets/purple.png"},
{value:10,img:"assets/pink.png"}
],
answer:25
}

];

const logoScreen=document.getElementById("logoScreen");
const titleScreen=document.getElementById("titleScreen");
const gameScreen=document.getElementById("gameScreen");
const endScreen=document.getElementById("endScreen");

const startBtn=document.getElementById("startBtn");
const hearBtn=document.getElementById("hearBtn");
const playAgain=document.getElementById("playAgain");

const questionBox=document.getElementById("questionBox");
const optionsDiv=document.getElementById("options");

const n1=document.getElementById("n1");
const n2=document.getElementById("n2");

const clap=document.getElementById("clap");
const wrong=document.getElementById("wrong");

let currentRound=0;
let wrongAttempts=0;
let answered=false;

function speak(text){

speechSynthesis.cancel();

const msg=new SpeechSynthesisUtterance(text);
msg.rate=0.9;
msg.pitch=1;
msg.volume=1;

speechSynthesis.speak(msg);

}

setTimeout(()=>{

logoScreen.classList.add("hidden");
titleScreen.classList.remove("hidden");


},5000);

startBtn.addEventListener("click",()=>{

speechSynthesis.cancel();

titleScreen.classList.add("hidden");
gameScreen.classList.remove("hidden");

loadRound();

});

hearBtn.addEventListener("click",()=>{

speak(rounds[currentRound].question);

});

function loadRound(){

wrongAttempts=0;
answered=false;

const round=rounds[currentRound];

questionBox.textContent=round.question;

n1.textContent=round.numbers[0];
n2.textContent=round.numbers[1];

optionsDiv.innerHTML="";

round.options.forEach(option=>{

const div=document.createElement("div");
div.className="option";

div.innerHTML=`<img src="${option.img}"> <span>${option.value}</span>`;

div.onclick=()=>checkAnswer(
option.value,
div
);

optionsDiv.appendChild(div);

});

setTimeout(()=>{
speak(round.question);
},500);

}

function checkAnswer(selected,element){

if(answered) return;

const round=rounds[currentRound];

if(selected===round.answer){

answered=true;

element.classList.add("correct");

clap.currentTime=0;
clap.play();

showFeedback("Good Job!");

setTimeout(()=>{

currentRound++;

if(currentRound<rounds.length){

loadRound();

}else{

finishGame();

}

},2000);

}else{

wrongAttempts++;

wrong.currentTime=0;
wrong.play();

element.classList.add("wiggle");

setTimeout(()=>{
element.classList.remove("wiggle");
},350);

if(wrongAttempts>=2){

showCorrectAnswer();

}

}

}

function showCorrectAnswer(){

const allOptions=
document.querySelectorAll(".option");

const answer=
rounds[currentRound].answer;

allOptions.forEach(option=>{

const number=
parseInt(
option.querySelector("span").textContent
);

if(number===answer){

option.classList.add("glow");

}

});

}

function showFeedback(text){

const div=document.createElement("div");

div.id="feedback";
div.textContent=text;

document.body.appendChild(div);

setTimeout(()=>{

div.remove();

},1500);

}

function finishGame(){

gameScreen.classList.add("hidden");
endScreen.classList.remove("hidden");

clap.currentTime=0;
clap.play();

speak("Great Job");

startConfetti();

}

playAgain.addEventListener("click",()=>{

location.reload();

});

/* CONFETTI */

const canvas=
document.getElementById("confetti");

const ctx=
canvas.getContext("2d");

function resizeCanvas(){

canvas.width=
window.innerWidth;

canvas.height=
window.innerHeight;

}

resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);

let confettiPieces=[];

function startConfetti(){

for(let i=0;i<180;i++){

confettiPieces.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height-canvas.height,

r:Math.random()*8+4,

speed:Math.random()*4+2,

color:`hsl(${Math.random()*360},80%,60%)`

});

}

animateConfetti();

}

function animateConfetti(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

confettiPieces.forEach(piece=>{

piece.y+=piece.speed;

ctx.fillStyle=
piece.color;

ctx.beginPath();

ctx.arc(
piece.x,
piece.y,
piece.r,
0,
Math.PI*2
);

ctx.fill();

});

requestAnimationFrame(
animateConfetti
);

}

</script>

</body>
</html>
