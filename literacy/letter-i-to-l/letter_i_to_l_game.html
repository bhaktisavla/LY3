<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Letter Ii to Ll</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:url('assets/backgroundd.jpg') center/cover no-repeat;min-height:100vh;color:#333}
#splash,#game,#end{display:none}
#splash{display:flex;align-items:center;justify-content:center;height:100vh;background:#fff}
#splash img{max-width:300px;width:70%}
.header{background:#ffda79;padding:10px;text-align:center;font-size:2rem;font-weight:bold}
.container{padding:10px;height:calc(100vh - 80px);box-sizing:border-box}
.question{background:#fff8d6;padding:10px;border-radius:12px;text-align:center;font-weight:bold}
.main{display:flex;gap:10px;height:calc(100% - 70px);margin-top:10px}
.left{width:28%;text-align:center}
.left img.letter{max-width:100%;max-height:220px}
.speaker{font-size:40px;cursor:pointer}
.right{flex:1;background:#eef8ff;border-radius:15px;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;align-content:start}
.card{background:white;border-radius:10px;padding:5px;text-align:center;cursor:pointer;border:3px solid transparent}
.card img{width:100%;height:90px;object-fit:contain}
.wiggle{animation:w .3s}
@keyframes w{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.glow{box-shadow:0 0 15px 5px gold}
.traceBox{background:white;border-radius:15px;padding:10px;height:100%;display:flex;flex-direction:column;align-items:center}
#traceCanvas{border:1px solid #ccc;background:url('assets/redandblueline.png') center/contain no-repeat;width:90%;max-width:700px;height:300px;touch-action:none}
.btn{padding:12px 20px;border:none;border-radius:10px;background:#4caf50;color:white;font-size:18px;cursor:pointer}
.tick{font-size:60px;color:green;text-align:center}
@media(max-width:768px){
.main{flex-direction:row}
.left{width:35%}
.card img{height:70px}
#traceCanvas{height:220px}
}
</style>
</head>
<body>
<div id="splash"><img src="assets/innovine-logo.png"></div>

<div id="game">
<div class="header">Letter Ii to Ll</div>
<div class="container" id="content"></div>
</div>

<div id="end">
<div class="header">🎉 Excellent Work! 🎉</div>
<div style="text-align:center;padding:30px">
<h2>All 8 Rounds Completed</h2>
<button class="btn" onclick="location.reload()">Play Again</button>
</div>
</div>

<audio id="rightSound" src="assets/right.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const rounds=[
{type:'select',letter:'Ii',img:'Ii.png',sound:'LetterI.mp3',targets:['igloo','iguana','infant','inkpot','insects'],items:['igloo','iguana','infant','inkpot','insects','jet','key']},
{type:'trace',letter:'Ii',sound:'LetterI.mp3'},
{type:'select',letter:'Jj',img:'Jj.png',sound:'LetterJ.mp3',targets:['jet','jam','jar','jeep','jelly'],items:['jet','jam','jar','jeep','jelly','igloo','kettle']},
{type:'trace',letter:'Jj',sound:'LetterJ.mp3'},
{type:'select',letter:'Kk',img:'Kk.png',sound:'LetterK.mp3',targets:['kettle','ketchup','key','kitepink','kitten','Kiwi'],items:['kettle','ketchup','key','kitepink','kitten','Kiwi','lantern','infant']},
{type:'trace',letter:'Kk',sound:'LetterK.mp3'},
{type:'select',letter:'Ll',img:'Ll.png',sound:'LetterL.mp3',targets:['lantern','leaf','lemon','lilypad','lion','log','lollipop','lotus'],items:['lantern','leaf','lemon','lilypad','lion','log','lollipop','lotus','jelly','kitten']},
{type:'trace',letter:'Ll',sound:'LetterL.mp3'}
];
let current=0;

function speak(t){
 if('speechSynthesis' in window){
 speechSynthesis.cancel();
 speechSynthesis.speak(new SpeechSynthesisUtterance(t));
 }
}

function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}

function loadRound(){
 if(current>=rounds.length){document.getElementById('game').style.display='none';document.getElementById('end').style.display='block';confetti();return;}
 const r=rounds[current];
 const c=document.getElementById('content');

 if(r.type==='select'){
 let selected=0,wrong=0;
 c.innerHTML=`<div class="question">${r.letter} - Identify the letter, listen to the letter sound and tap on the objects that start with letter ${r.letter}. <span class="speaker" onclick="playLetter('${r.sound}')">🔊</span></div>
 <div class="main">
 <div class="left"><img class="letter" src="assets/${r.img}"></div>
 <div class="right" id="grid"></div></div>`;
 let grid=document.getElementById('grid');
 shuffle(r.items).forEach(n=>{
 let ext=n.includes('jpg')||n.includes('jpeg')||n.includes('png')?n:'';
 let file=n;
 const map={key:'key.jpeg',kettle:'kettle.jpeg',jelly:'jelly.jpg',kitten:'kitten.jpg',Kiwi:'Kiwi.png',lemon:'lemon.jpeg',lilypad:'lilypad.jpg'};
 if(map[n]) file=map[n];
 else file=n+'.png';
 let d=document.createElement('div');
 d.className='card';
 d.innerHTML=`<img src="assets/${file}">`;
 d.onclick=()=>{
   if(r.targets.includes(n)){
      d.style.visibility='hidden';
      selected++;
      rightSound.play();
      if(selected===r.targets.length){
        clapSound.play();
        setTimeout(()=>{current++;loadRound();},1200);
      }
   }else{
      wrongSound.play();
      wrong++;
      d.classList.add('wiggle');
      setTimeout(()=>d.classList.remove('wiggle'),300);
      if(wrong>=2){
       [...grid.children].forEach((x,i)=>{
        let nm=shuffle(r.items)[i];
       });
       document.querySelectorAll('.card').forEach(card=>{
         let img=card.querySelector('img').src;
         r.targets.forEach(t=>{ if(img.includes(t)) card.classList.add('glow');});
       });
      }
   }
 };
 grid.appendChild(d);
 });
 speak("Identify the letter, listen to the letter sound and tap on the objects that start with letter "+r.letter);
 } else {
 c.innerHTML=`<div class="question">Listen to the letter sound and write the letter ${r.letter}. <span class="speaker" onclick="playLetter('${r.sound}')">🔊</span></div>
 <div class="traceBox">
 <canvas id="traceCanvas"></canvas>
 <br><button class="btn" onclick="finishTrace()">Done</button>
 </div>`;
 initCanvas();
 speak("Listen to the letter sound and write the letter "+r.letter);
 }
}
function playLetter(f){new Audio('assets/'+f).play();}
const rightSound=document.getElementById('rightSound');
const wrongSound=document.getElementById('wrongSound');
const clapSound=document.getElementById('clapSound');

function finishTrace(){
 rightSound.play(); clapSound.play();
 setTimeout(()=>{current++;loadRound();},1000);
}

function initCanvas(){
 const canvas=document.getElementById('traceCanvas');
 const rect=canvas.getBoundingClientRect();
 canvas.width=rect.width; canvas.height=rect.height;
 const ctx=canvas.getContext('2d');
 ctx.lineWidth=6; ctx.lineCap='round';
 let draw=false;
 function pos(e){let r=canvas.getBoundingClientRect();let t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
 canvas.onmousedown=e=>{draw=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);};
 canvas.onmousemove=e=>{if(!draw)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();};
 canvas.onmouseup=()=>draw=false;
 canvas.ontouchstart=e=>{draw=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);}
 canvas.ontouchmove=e=>{e.preventDefault();if(!draw)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();}
 canvas.ontouchend=()=>draw=false;
}

function confetti(){
 for(let i=0;i<100;i++){
  let d=document.createElement('div');
  d.innerHTML='🎊';
  d.style.position='fixed';
  d.style.left=Math.random()*100+'vw';
  d.style.top='-20px';
  d.style.fontSize='24px';
  d.style.transition='3s';
  document.body.appendChild(d);
  setTimeout(()=>{d.style.top='100vh';},50);
 }
}

document.getElementById('splash').style.display='flex';
setTimeout(()=>{
 document.getElementById('splash').style.display='none';
 document.getElementById('game').style.display='block';
 loadRound();
},5000);
</script>
</body>
</html>
