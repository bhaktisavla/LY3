<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Letter Ii to Ll</title>
<style>
body{margin:0;font-family:Arial;background:url('assets/backgroundd.jpg') center/cover no-repeat;min-height:100vh}
#splash,#finish{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:10}
#finish{display:none;flex-direction:column}
.header{background:#ffd54f;padding:10px;text-align:center;font-size:32px;font-weight:bold}
.question{margin:8px;background:#fff8d6;padding:10px;border-radius:10px;text-align:center}
.main{display:flex;gap:10px;padding:8px}
.left{width:28%;text-align:center}
.left img{max-width:100%;max-height:220px}
.btn{padding:8px 12px;margin:4px;border:none;border-radius:8px;background:#4caf50;color:#fff}
.box{flex:1;background:#eef7ff;border-radius:12px;padding:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.card{background:#fff;border-radius:8px;padding:4px}
.card img{width:100%;height:80px;object-fit:contain}
.glow{box-shadow:0 0 12px gold}
canvas{background:url('assets/redandblueline.png') center/contain no-repeat #fff;border:1px solid #999;width:90%;height:300px;touch-action:none}
</style>
</head>
<body>
<div id="splash"><img src="assets/innovine-logo.png" width="250"></div>
<div id="game" style="display:none">
<div class="header">Letter Ii to Ll</div>
<div id="content"></div>
</div>
<div id="finish"><h1>🎉 Great Job! 🎉</h1><button onclick="location.reload()">Play Again</button></div>

<audio id="ok" src="assets/correct.mp3"></audio>
<audio id="bad" src="assets/wrong.mp3"></audio>
<audio id="clap" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const rounds=[
{t:'s',L:'Ii',img:'Ii.png',snd:'letterI.mp3',a:['igloo','iguana','infant','inkpot','insects'],i:['igloo.png','iguana.png','infant.png','inkpot.png','insects.jpg','jet.png','key.jpeg']},
{t:'w',L:'Ii',snd:'letterI.mp3'},
{t:'s',L:'Jj',img:'Jj.png',snd:'letterJ.mp3',a:['jet','jam','jar','jeep','jelly'],i:['jet.png','jam.jpg','jar.png','jeep.png','jelly.jpg','igloo.png','kettle.jpeg']},
{t:'w',L:'Jj',snd:'letterJ.mp3'},
{t:'s',L:'Kk',img:'Kk.png',snd:'letterK.mp3',a:['kettle','ketchup','key','kitepink','kitten','Kiwi'],i:['kettle.jpeg','ketchup.png','key.jpeg','kitepink.png','kitten.jpg','Kiwi.png','lantern.png','infant.png']},
{t:'w',L:'Kk',snd:'letterK.mp3'},
{t:'s',L:'Ll',img:'Ll.png',snd:'letterL.mp3',a:['lantern','leaf','lemon','lilypad','lion','log','lollipop','lotus'],i:['lantern.png','leaf.png','lemon.jpeg','lilypad.jpg','lion.png','log.png','lollipop.png','lotus.png','jelly.jpg','kitten.jpg']},
{t:'w',L:'Ll',snd:'letterL.mp3'}
];

// Original uploaded game preserved exactly, only asset file names corrected

let n=0,ctx,cv;
function speak(t){if(window.speechSynthesis){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t));}}
function qAgain(t){speak(t)}
function load(){
if(n>=8){game.style.display='none';finish.style.display='flex';return;}
let r=rounds[n],c=document.getElementById('content');
if(r.t==='s'){
let q="Identify the letter, listen to the letter sound and tap the pictures that start with "+r.L;
let found=0,wrongs=0;
c.innerHTML=`<div class='question'>Round ${n+1} of 8<br>${q}</div>
<div class='main'><div class='left'>
<img src='assets/${r.img}'><br>
<button class='btn' onclick="new Audio('assets/${r.snd}').play()">🔊 Letter Sound</button><br>
<button class='btn' onclick="qAgain('${q}')">🔊 Hear Question</button>
</div><div class='box'><div class='grid' id='g'></div></div></div>`;
let g=document.getElementById('g');
r.i.sort(()=>Math.random()-0.5).forEach(f=>{
let d=document.createElement('div');d.className='card';d.innerHTML=`<img src="assets/${f}">`;
d.onclick=()=>{
let name=f.split('.')[0];
if(r.a.includes(name)){d.style.visibility='hidden';ok.play();found++;
if(found===r.a.length){clap.play();setTimeout(()=>{n++;load();},1000);}}
else{bad.play();wrongs++;if(wrongs>=2){document.querySelectorAll('.card').forEach(x=>{let s=x.innerHTML;r.a.forEach(a=>{if(s.includes(a))x.classList.add('glow');});});}}
};
g.appendChild(d);
});
speak(q);
}else{
let q="Listen to the letter sound and write the letter "+r.L;
c.innerHTML=`<div class='question'>Round ${n+1} of 8<br>${q}</div>
<div style='text-align:center'>
<button class='btn' onclick="playBoth('${q}','${r.snd}')">🔊 Hear Question Again</button><br><br>
<canvas id='cv'></canvas><br>
<button class='btn' onclick='eraseCanvas()'>🧹 Erase</button>
<button class='btn' onclick='doneWrite()'>✓ Done</button>
</div>`;
setupCanvas(); playBoth(q,r.snd);
}
}
function playBoth(q,s){speak(q);setTimeout(()=>new Audio('assets/'+s).play(),1000);}
function doneWrite(){ok.play();clap.play();setTimeout(()=>{n++;load();},800);}
function setupCanvas(){
cv=document.getElementById('cv');cv.width=cv.offsetWidth;cv.height=300;ctx=cv.getContext('2d');ctx.lineWidth=6;
let d=false;
const p=e=>{let r=cv.getBoundingClientRect();let t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
cv.onmousedown=e=>{d=true;let m=p(e);ctx.beginPath();ctx.moveTo(m.x,m.y)}
cv.onmousemove=e=>{if(!d)return;let m=p(e);ctx.lineTo(m.x,m.y);ctx.stroke();}
cv.onmouseup=()=>d=false;
cv.ontouchstart=e=>{d=true;let m=p(e);ctx.beginPath();ctx.moveTo(m.x,m.y)}
cv.ontouchmove=e=>{e.preventDefault();if(!d)return;let m=p(e);ctx.lineTo(m.x,m.y);ctx.stroke();}
cv.ontouchend=()=>d=false;
}
function eraseCanvas(){ctx.clearRect(0,0,cv.width,cv.height);}
setTimeout(()=>{splash.style.display='none';game.style.display='block';load();},5000);
</script>
</body></html>
