<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Mm to Pp - Memory & Writing Game</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('assets/backdrop.png') no-repeat center center fixed;
    background-size: cover;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #logoScreen, #gameScreen, #endScreen {
    display: none;
    width: 100%;
    max-width: 900px;
    text-align: center;
    margin-top: 20px;
  }
  #logoScreen img {
    width: 200px;
    margin-top: 100px;
  }
  h1 {
    font-size: 2rem;
    margin: 10px 0;
    color: #4a2caa;
  }
  .questionBox {
    background: rgba(255,255,255,0.9);
    padding: 10px;
    border-radius: 15px;
    margin: 10px 0;
    position: relative;
  }
  .questionBox button {
    border: none;
    background: none;
    font-size: 1.2rem;
    cursor: pointer;
  }
  #memoryGrid {
    display: grid;
    grid-template-columns: repeat(4, 120px);
    grid-gap: 15px;
    justify-content: center;
    margin: 20px 0;
  }
  .card {
    width: 120px;
    height: 120px;
    border-radius: 15px;
    background: #fff;
    box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
  }
  .card img {
    max-width: 100%;
    max-height: 100%;
    display: none;
  }
  .card.show img {
    display: block;
  }
  .card.correct {
    border: 4px solid #00b300;
  }
  .card.incorrect {
    animation: shake 0.5s;
  }
  @keyframes shake {
    0% { transform: translateX(0px); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0px); }
  }
  #redBlueCanvas {
    border: 2px solid #000;
    border-radius: 10px;
    touch-action: none;
    margin: 10px 0;
    background: white;
  }
  #controls {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 15px;
  }
  button {
    padding: 10px 15px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 1rem;
  }
  #endScreen {
    margin-top: 50px;
  }
  #confettiCanvas {
    position: fixed;
    top: 0;
    left:0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  @media(max-width:600px){
    #memoryGrid {
      grid-template-columns: repeat(2, 120px);
    }
    .card {
      width: 100px;
      height: 100px;
    }
  }
</style>
</head>
<body>

<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<div id="gameScreen">
  <h1>Letter Mm to Pp</h1>
  <div class="questionBox">
    <span id="roundTitle"></span>
    <button id="hearQuestion"><img src="assets/speaker.png" width="24"> Hear Again</button>
  </div>
  <div id="memoryGrid"></div>
  <canvas id="redBlueCanvas" width="300" height="150"></canvas>
  <div id="controls">
    <button id="playLetterSound"><img src="assets/speaker.png" width="24"> Play Sound</button>
    <button id="eraseCanvas">Eraser</button>
  </div>
</div>

<div id="endScreen">
  <h1>Good Job!</h1>
  <button id="playAgain">Play Again</button>
</div>

<canvas id="confettiCanvas"></canvas>

<audio id="correctAudio" src="assets/correct.mp3"></audio>
<audio id="wrongAudio" src="assets/wrong.mp3"></audio>
<audio id="clapAudio" src="assets/freesound_community-claps-44774.mp3"></audio>
<audio id="letterM" src="assets/letterM.mp3"></audio>
<audio id="letterN" src="assets/letterN.mp3"></audio>
<audio id="letterO" src="assets/letterO.mp3"></audio>
<audio id="letterP" src="assets/letterP.mp3"></audio>

<script>
// ------------------------- Game Data --------------------------
const rounds = [
  {type:'memory', letters:['Mm','Nn','Oo','Pp'], images:['milk.png','napkin.png','octopus.png','paintbrush.png'], sound:'letterM'},
  {type:'write', letter:'Mm', sound:'letterM'},
  {type:'memory', letters:['Mm','Nn','Oo','Pp'], images:['mirror.png','nest.png','olive.jpg','panda.png'], sound:'letterM'},
  {type:'write', letter:'Nn', sound:'letterN'},
  {type:'memory', letters:['Mm','Nn','Oo','Pp'], images:['monkey.png','net.png','onion.png','parrot.png'], sound:'letterM'},
  {type:'write', letter:'Oo', sound:'letterO'},
  {type:'memory', letters:['Mm','Nn','Oo','Pp'], images:['mountain.png','newspaper.png','orange.png','pumpkin.png'], sound:'letterM'},
  {type:'write', letter:'Pp', sound:'letterP'},
  {type:'memory', letters:['Mm','Nn','Oo','Pp'], images:['mushroom.png','nose.png','ostrich.png','purse.png'], sound:'letterM'}
];

// ------------------------- Global Variables --------------------------
let currentRound = 0;
let selectedLetterCard = null;
let memoryCards = [];
let canvas, ctx, drawing=false;
let lastX=0,lastY=0;

// ------------------------- Utility Functions --------------------------
function shuffle(array){
  return array.sort(()=> Math.random()-0.5);
}

// ------------------------- Logo Splash --------------------------
const logoScreen = document.getElementById('logoScreen');
const gameScreen = document.getElementById('gameScreen');
const endScreen = document.getElementById('endScreen');
logoScreen.style.display='block';
setTimeout(()=>{ 
  logoScreen.style.display='none';
  startRound();
},5000);

// ------------------------- Start Round --------------------------
function startRound(){
  if(currentRound >= rounds.length){
    showEndScreen();
    return;
  }
  const round = rounds[currentRound];
  document.getElementById('memoryGrid').innerHTML='';
  document.getElementById('redBlueCanvas').style.display='none';
  document.getElementById('controls').style.display='none';

  if(round.type==='memory'){
    setupMemoryRound(round);
  } else if(round.type==='write'){
    setupWritingRound(round);
  }
}

// ------------------------- Memory Round --------------------------
function setupMemoryRound(round){
  const grid = document.getElementById('memoryGrid');
  const letters = round.letters.map(l=>({type:'letter',img:`assets/${l}.png`}));
  const images = round.images.map(img=>({type:'image',img:`assets/${img}`}));
  memoryCards = shuffle([...letters,...images]);

  memoryCards.forEach((cardData,index)=>{
    const card = document.createElement('div');
    card.classList.add('card');
    card.dataset.index=index;
    const img = document.createElement('img');
    img.src = cardData.img;
    card.appendChild(img);
    card.addEventListener('click',()=>handleCardClick(card,index));
    grid.appendChild(card);
  });

  document.getElementById('roundTitle').textContent = 'Find a pair. Flip over cards to match letter & picture.';
  document.getElementById('hearQuestion').onclick = ()=>{
    new Audio(`assets/${round.sound}.mp3`).play();
  };
}

function handleCardClick(card,index){
  const data = memoryCards[index];
  if(card.classList.contains('show') || card.classList.contains('correct')) return;

  if(data.type==='letter'){
    if(selectedLetterCard) selectedLetterCard.classList.remove('show'); // auto close previous letter
    card.classList.add('show');
    selectedLetterCard = card;
  } else {
    card.classList.add('show');
    if(!selectedLetterCard){
      setTimeout(()=>card.classList.remove('show'),500);
      return;
    }
    const letterIndex = memoryCards.indexOf(selectedLetterCard.dataset.index);
    if(data.img[7].toLowerCase() === selectedLetterCard.dataset.index){ // rough match by first char
      card.classList.add('correct');
      selectedLetterCard.classList.add('correct');
      selectedLetterCard = null;
      new Audio('assets/correct.mp3').play();
      checkMemoryComplete();
    } else {
      card.classList.add('incorrect');
      new Audio('assets/wrong.mp3').play();
      setTimeout(()=>{card.classList.remove('show','incorrect');},800);
      selectedLetterCard.classList.remove('show');
      selectedLetterCard=null;
    }
  }
}

function checkMemoryComplete(){
  const correct = document.querySelectorAll('.card.correct');
  if(correct.length === memoryCards.length){
    new Audio('assets/freesound_community-claps-44774.mp3').play();
    setTimeout(()=>{
      currentRound++;
      startRound();
    },1000);
  }
}

// ------------------------- Writing Round --------------------------
function setupWritingRound(round){
  const canvasEl = document.getElementById('redBlueCanvas');
  canvasEl.style.display='block';
  canvas = canvasEl;
  ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  document.getElementById('controls').style.display='flex';
  document.getElementById('roundTitle').textContent = `Letter ${round.letter}`;
  document.getElementById('hearQuestion').onclick = ()=>document.getElementById(round.sound).play();
  document.getElementById('playLetterSound').onclick = ()=>document.getElementById(round.sound).play();
  document.getElementById('eraseCanvas').onclick = ()=>ctx.clearRect(0,0,canvas.width,canvas.height);

  canvas.addEventListener('pointerdown', e=>{
    drawing=true;
    [lastX,lastY]=[e.offsetX,e.offsetY];
  });
  canvas.addEventListener('pointermove', e=>{
    if(!drawing) return;
    ctx.strokeStyle='black';
    ctx.lineWidth=4;
    ctx.lineJoin='round';
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(e.offsetX,e.offsetY);
    ctx.stroke();
    [lastX,lastY]=[e.offsetX,e.offsetY];
  });
  canvas.addEventListener('pointerup', e=>{
    drawing=false;
    setTimeout(()=>{
      currentRound++;
      startRound();
    },500);
  });
}

// ------------------------- End Screen --------------------------
function showEndScreen(){
  gameScreen.style.display='none';
  endScreen.style.display='block';
  runConfetti();
  document.getElementById('playAgain').onclick = ()=>{currentRound=0; endScreen.style.display='none'; startRound();}
}

// ------------------------- Confetti --------------------------
function runConfetti(){
  const confetti = document.getElementById('confettiCanvas');
  confetti.width = window.innerWidth;
  confetti.height = window.innerHeight;
  const ctx = confetti.getContext('2d');
  const particles = [];
  for(let i=0;i<150;i++){
    particles.push({
      x:Math.random()*confetti.width,
      y:Math.random()*confetti.height,
      r:Math.random()*6+4,
      d:Math.random()*10+2,
      color:`hsl(${Math.random()*360},70%,60%)`,
      tilt:Math.random()*10-10,
      tiltAngleIncrement:Math.random()*0.07+0.05,
      tiltAngle:0
    });
  }
  function draw(){
    ctx.clearRect(0,0,confetti.width,confetti.height);
    particles.forEach(p=>{
      ctx.beginPath();
      ctx.lineWidth = p.r/2;
      ctx.strokeStyle = p.color;
      ctx.moveTo(p.x + p.tilt + p.r/4, p.y);
      ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r/4);
      ctx.stroke();
      p.tiltAngle += p.tiltAngleIncrement;
      p.y += (Math.cos(p.d)+3+p.r/2)/2;
      p.x += Math.sin(p.d);
      p.tilt = Math.sin(p.tiltAngle)*15;
      if(p.y>confetti.height){p.y= -10; p.x=Math.random()*confetti.width;}
    });
    requestAnimationFrame(draw);
  }
  draw();
}

// ------------------------- Initialize --------------------------
gameScreen.style.display='block';
</script>
</body>
</html>
