<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory & Tracing Game M–P</title>
<style>
body { font-family: 'Comic Sans MS', cursive, sans-serif; background:#fde6d1; text-align:center; margin:0; }
h1 { font-size:2em; color:#4b2e83; margin:20px 0; }
button { padding:10px 20px; margin:5px; font-size:16px; border:none; border-radius:5px; background:#f08080; color:#fff; cursor:pointer; }
canvas { border:2px solid #ccc; touch-action:none; margin-top:10px; }
.card { width:80px; height:80px; display:inline-block; margin:5px; border:2px solid orange; font-size:24px; vertical-align:middle; line-height:80px; background:#fff; cursor:pointer; }
.card.correct { border-color:green; background:#ccffcc; }
.hidden { background:#fff; color:#fff; cursor:pointer; }
.confetti { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999; }
#letterImg { width:100px; margin-top:10px; }
.speaker-icon { width:30px; vertical-align:middle; cursor:pointer; margin-left:5px; }
</style>
</head>
<body>

<h1 id="roundTitle">Letter Mm to Pp</h1>
<p id="roundQuestion"></p>
<img id="letterImg" src="" alt="">
<button id="hearAgain"><img class="speaker-icon" src="assets/speaker.png" alt="Hear Again"> Hear Again</button>

<div id="gameBoard"></div>
<canvas id="traceCanvas" width="320" height="200"></canvas>
<br>
<button id="eraser">Eraser</button>
<button id="done">Done</button>

<audio id="audioQuestion"></audio>
<audio id="audioLetter"></audio>
<audio id="correctAudio" src="assets/correct.mp3"></audio>
<audio id="wrongAudio" src="assets/wrong.mp3"></audio>

<script>
const rounds = [
  { type:'memory', question:'Flip over cards to find matching pairs of letter and picture card.', letters:['Mm','Nn','Oo','Pp'], pictures:['mountain.png','newspaper.png','pumpkin.png','napkin.png'], audio:'audioQ1.mp3' },
  { type:'trace', question:'Listen to the letter sound and write the letter Mm.', letter:'Mm.png', audio:'audioQ2.mp3', letterAudio:'letterM.mp3' },
  { type:'memory', question:'Flip over cards to find matching pairs.', letters:['Mm','Nn','Oo','Pp'], pictures:['milk.png','mirror.png','olive.jpg','octopus.png'], audio:'audioQ3.mp3' },
  { type:'trace', question:'Listen to the letter sound and write the letter Nn.', letter:'Nn.png', audio:'audioQ4.mp3', letterAudio:'letterN.mp3' },
  { type:'memory', question:'Flip over cards to find matching pairs.', letters:['Mm','Nn','Oo','Pp'], pictures:['mushroom.png','milk.png','onion.png','octopus.png'], audio:'audioQ5.mp3' },
  { type:'trace', question:'Listen to the letter sound and write the letter Oo.', letter:'Oo.png', audio:'audioQ6.mp3', letterAudio:'letterO.mp3' },
  { type:'memory', question:'Flip over cards to find matching pairs.', letters:['Mm','Nn','Oo','Pp'], pictures:['net.png','nose.png','orange.png','panda.png'], audio:'audioQ7.mp3' },
  { type:'trace', question:'Listen to the letter sound and write the letter Pp.', letter:'Pp.png', audio:'audioQ8.mp3', letterAudio:'letterP.mp3' },
  { type:'memory', question:'Flip over cards to find matching pairs.', letters:['Mm','Nn','Oo','Pp'], pictures:['parrot.png','pumpkin.png','paintbrush.png','ostrich.png'], audio:'audioQ9.mp3' }
];

let currentRound = 0;
const board = document.getElementById('gameBoard');
const roundTitle = document.getElementById('roundTitle');
const roundQuestion = document.getElementById('roundQuestion');
const letterImg = document.getElementById('letterImg');
const traceCanvas = document.getElementById('traceCanvas');
const ctx = traceCanvas.getContext('2d');
const hearAgain = document.getElementById('hearAgain');
const audioQuestion = document.getElementById('audioQuestion');
const audioLetter = document.getElementById('audioLetter');

let firstCard = null;
let secondCard = null;

function startRound(){
  const round = rounds[currentRound];
  roundTitle.innerText = `Round ${currentRound+1} - ${round.type==='memory'?'Memory':'Tracing'}`;
  roundQuestion.innerText = round.question;

  audioQuestion.src = `assets/${round.audio}`;
  audioQuestion.play();

  if(round.type==='memory'){
    traceCanvas.style.display='none';
    letterImg.style.display='none';
    board.style.display='block';
    board.innerHTML = '';
    const cards = [...round.letters,...round.pictures];
    cards.sort(()=>0.5-Math.random());
    cards.forEach(c=>{
      const div = document.createElement('div');
      div.className='card hidden';
      div.dataset.value=c;
      div.addEventListener('click',()=>selectCard(div, round));
      div.innerText = c.includes('.png') || c.includes('.jpg') ? '' : c;
      board.appendChild(div);
    });
  } else {
    board.style.display='none';
    letterImg.style.display='block';
    traceCanvas.style.display='block';
    letterImg.src=`assets/${round.letter}`;
    audioLetter.src=`assets/${round.letterAudio}`;
    ctx.clearRect(0,0,traceCanvas.width,traceCanvas.height);
    // draw red/blue lines
    ctx.strokeStyle='red';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(5,5); ctx.lineTo(traceCanvas.width-5,5); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(5,traceCanvas.height-5); ctx.lineTo(traceCanvas.width-5,traceCanvas.height-5); ctx.stroke();
    ctx.strokeStyle='blue';
    ctx.beginPath();
    ctx.moveTo(5,traceCanvas.height/3); ctx.lineTo(traceCanvas.width-5,traceCanvas.height/3); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(5,traceCanvas.height*2/3); ctx.lineTo(traceCanvas.width-5,traceCanvas.height*2/3); ctx.stroke();
  }
}

function selectCard(div, round){
  if(firstCard && !secondCard){
    secondCard=div;
    div.classList.remove('hidden');
    checkMatch(round);
  } else if(!firstCard){
    firstCard=div;
    div.classList.remove('hidden');
  } else if(firstCard && secondCard){
    // close 2nd card automatically
    secondCard.classList.add('hidden');
    secondCard=null;
    firstCard=div;
    div.classList.remove('hidden');
  }
}

function checkMatch(round){
  if(firstCard.dataset.value === secondCard.dataset.value){
    firstCard.classList.add('correct');
    secondCard.classList.add('correct');
    audioQuestion.src='assets/correct.mp3';
    audioQuestion.play();
    firstCard=null;
    secondCard=null;
  } else {
    setTimeout(()=>{
      firstCard.classList.add('hidden');
      secondCard.classList.add('hidden');
      audioQuestion.src='assets/wrong.mp3';
      audioQuestion.play();
      firstCard=null;
      secondCard=null;
    },800);
  }
}

hearAgain.addEventListener('click',()=>{
  const round = rounds[currentRound];
  audioQuestion.src = `assets/${round.audio}`;
  audioQuestion.play();
});

traceCanvas.addEventListener('pointerdown',startStroke);
traceCanvas.addEventListener('pointermove',drawStroke);
traceCanvas.addEventListener('pointerup',endStroke);
let drawing=false;
function startStroke(e){
  drawing=true;
  ctx.beginPath();
  ctx.moveTo(e.offsetX,e.offsetY);
}
function drawStroke(e){
  if(!drawing) return;
  ctx.lineTo(e.offsetX,e.offsetY);
  ctx.strokeStyle='black';
  ctx.lineWidth=3;
  ctx.stroke();
}
function endStroke(e){drawing=false;}

document.getElementById('eraser').addEventListener('click',()=>{
  ctx.clearRect(0,0,traceCanvas.width,traceCanvas.height);
});

document.getElementById('done').addEventListener('click',()=>{
  currentRound++;
  if(currentRound<rounds.length) startRound();
  else alert('Well Done! All rounds completed.');
});

// start first round
startRound();

</script>
</body>
</html>
