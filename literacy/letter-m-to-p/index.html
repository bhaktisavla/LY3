<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Mm to Pp</title>
<style>
    body {
        font-family: 'Comic Sans MS', Arial, sans-serif;
        background: url('assets/backdrop.png') no-repeat center center fixed;
        background-size: cover;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }
    #logo-screen, #round-screen, #end-screen {
        display: none;
        width: 100vw;
        height: 100vh;
        text-align: center;
        position: relative;
        background: rgba(255,255,255,0.1);
    }
    #logo-screen img {
        margin-top: 20vh;
        max-width: 50%;
    }
    h1 {
        color: #4B0082;
        font-size: 3vw;
        margin-top: 2vh;
    }
    #question-text {
        font-size: 1.8vw;
        margin: 1vh 0;
    }
    .cards-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1vw;
        justify-items: center;
        margin-top: 2vh;
    }
    .card {
        width: 18vw;
        max-width: 120px;
        height: 18vw;
        max-height: 120px;
        background: #fff;
        border: 3px solid orange;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2vw;
        cursor: pointer;
        user-select: none;
    }
    .card.revealed {
        border-color: green;
        background-color: #ccffcc;
    }
    #tracing-canvas {
        border: 2px solid #888;
        touch-action: none;
        margin-top: 2vh;
        background: #fff;
    }
    #letter-img {
        width: 15vw;
        max-width: 80px;
        margin-top: 1vh;
    }
    .control-btn {
        margin: 1vh;
        padding: 0.5em 1em;
        font-size: 1em;
        border: none;
        border-radius: 5px;
        background-color: #f08080;
        color: #fff;
        cursor: pointer;
    }
    #hear-again {
        background-color: #ff7f50;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #hear-again img {
        width: 2vw;
        margin-right: 0.5vw;
    }
</style>
</head>
<body>

<div id="logo-screen">
    <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<div id="round-screen">
    <h1>Letter Mm to Pp</h1>
    <div id="question-container">
        <span id="question-text"></span>
        <button id="hear-again"><img src="assets/speaker.png"> Hear Again</button>
    </div>
    <div id="letter-container">
        <img id="letter-img" src="" alt="Letter">
    </div>
    <canvas id="tracing-canvas" width="300" height="200"></canvas>
    <div class="control-btn" id="eraser-btn">Eraser</div>
    <div class="control-btn" id="done-btn">Done</div>
    <div class="cards-container" id="cards-container"></div>
</div>

<div id="end-screen">
    <h1>Good Job!</h1>
    <button class="control-btn" id="play-again">Play Again</button>
</div>

<script>
const rounds = [
    {type:'memory', question:'Flip over cards to find matching pairs of letter and picture card.', letters:['Mm','Nn','Oo','Pp'], images:['milk.png','napkin.png','octopus.png','paintbrush.png']},
    {type:'tracing', question:'Listen to the letter sound and write the letter Mm.', letter:'Mm', sound:'letterM.mp3'},
    {type:'memory', question:'Flip over cards to find matching pairs of letter and picture card.', letters:['Mm','Nn','Oo','Pp'], images:['mirror.png','nest.png','olive.png','panda.png']},
    {type:'tracing', question:'Listen to the letter sound and write the letter Nn.', letter:'Nn', sound:'letterN.mp3'},
    {type:'memory', question:'Flip over cards to find matching pairs of letter and picture card.', letters:['Mm','Nn','Oo','Pp'], images:['monkey.png','net.png','onion.png','parrot.png']},
    {type:'tracing', question:'Listen to the letter sound and write the letter Oo.', letter:'Oo', sound:'letterO.mp3'},
    {type:'memory', question:'Flip over cards to find matching pairs of letter and picture card.', letters:['Mm','Nn','Oo','Pp'], images:['mountain.png','newspaper.png','orange.png','pumpkin.png']},
    {type:'tracing', question:'Listen to the letter sound and write the letter Pp.', letter:'Pp', sound:'letterP.mp3'},
    {type:'memory', question:'Flip over cards to find matching pairs of letter and picture card.', letters:['Mm','Nn','Oo','Pp'], images:['mushroom.png','nose.png','ostrich.png','purse.png']}
];

let currentRound = 0;
const logoScreen = document.getElementById('logo-screen');
const roundScreen = document.getElementById('round-screen');
const endScreen = document.getElementById('end-screen');
const questionText = document.getElementById('question-text');
const letterImg = document.getElementById('letter-img');
const hearAgainBtn = document.getElementById('hear-again');
const tracingCanvas = document.getElementById('tracing-canvas');
const ctx = tracingCanvas.getContext('2d');
const eraserBtn = document.getElementById('eraser-btn');
const doneBtn = document.getElementById('done-btn');
const cardsContainer = document.getElementById('cards-container');
const playAgainBtn = document.getElementById('play-again');

let isDrawing = false;
let currentPath = [];
let questionAudio = new Audio();
let letterAudio = new Audio();

function showLogoScreen() {
    logoScreen.style.display = 'block';
    setTimeout(() => {
        logoScreen.style.display = 'none';
        showRound();
    }, 5000);
}

function showRound() {
    roundScreen.style.display = 'block';
    endScreen.style.display = 'none';
    loadRound(rounds[currentRound]);
}

function loadRound(round) {
    questionText.textContent = round.question;
    questionAudio.src = `assets/question${currentRound+1}.mp3`;
    questionAudio.play();

    if(round.type === 'tracing') {
        letterImg.src = `assets/${round.letter}.png`;
        letterAudio.src = `assets/${round.sound}`;
        tracingCanvas.style.display = 'block';
        cardsContainer.style.display = 'none';
        clearCanvas();
    } else {
        letterImg.src = '';
        tracingCanvas.style.display = 'none';
        cardsContainer.style.display = 'grid';
        loadMemoryCards(round);
    }
}

hearAgainBtn.addEventListener('click', ()=>{
    questionAudio.currentTime=0;
    questionAudio.play();
});

eraserBtn.addEventListener('click', clearCanvas);
doneBtn.addEventListener('click', nextRound);
playAgainBtn.addEventListener('click', ()=>{
    currentRound=0;
    showRound();
});

function clearCanvas(){
    ctx.clearRect(0,0,tracingCanvas.width,tracingCanvas.height);
}

tracingCanvas.addEventListener('pointerdown', (e)=>{isDrawing=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);});
tracingCanvas.addEventListener('pointermove', (e)=>{if(isDrawing){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();}});
tracingCanvas.addEventListener('pointerup', ()=>{isDrawing=false;});
tracingCanvas.addEventListener('pointerleave', ()=>{isDrawing=false;});

function nextRound(){
    currentRound++;
    if(currentRound>=rounds.length){
        roundScreen.style.display='none';
        endScreen.style.display='block';
    } else {
        loadRound(rounds[currentRound]);
    }
}

function loadMemoryCards(round){
    cardsContainer.innerHTML='';
    const cards=[];
    for(let i=0;i<round.letters.length;i++){
        cards.push({type:'letter', value:round.letters[i]});
        cards.push({type:'image', value:round.images[i]});
    }
    cards.sort(()=>0.5-Math.random());
    let firstCard=null;

    cards.forEach(c=>{
        const div=document.createElement('div');
        div.className='card';
        div.dataset.type=c.type;
        div.dataset.value=c.value;
        div.addEventListener('click',()=>{
            if(div.classList.contains('revealed')) return;
            if(firstCard && firstCard===div){return;}
            if(c.type==='image' && (!firstCard || firstCard.dataset.type!=='letter')){
                // clicked image first, close immediately
                div.classList.add('revealed');
                setTimeout(()=>div.classList.remove('revealed'),500);
                return;
            }
            div.classList.add('revealed');
            if(!firstCard){
                firstCard=div;
            } else {
                if(firstCard.dataset.value===c.value){
                    firstCard= null;
                    checkMemoryRoundComplete();
                } else {
                    setTimeout(()=>{firstCard.classList.remove('revealed'); div.classList.remove('revealed'); firstCard=null;},500);
                }
            }
        });
        cardsContainer.appendChild(div);
    });
}

function checkMemoryRoundComplete(){
    const unrevealed=document.querySelectorAll('.card:not(.revealed)');
    if(unrevealed.length===0){
        nextRound();
    }
}

showLogoScreen();
</script>
</body>
</html>
