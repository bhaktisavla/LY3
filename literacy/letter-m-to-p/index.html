<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Mm to Pp Game</title>
<style>
  body { margin:0; font-family: 'Comic Sans MS', cursive, sans-serif; background:#fde9d9; text-align:center; }
  #logoScreen, #gameScreen, #endScreen { display:none; }
  #logoScreen img { width:200px; margin-top:100px; }
  .roundTitle { font-size:2rem; margin-top:20px; color:#4b2e83; }
  .instruction { font-size:1.2rem; margin:10px; }
  .hearAgain { background:#ff7f50; color:white; border:none; padding:8px 15px; border-radius:5px; font-size:1rem; cursor:pointer; margin-left:10px; }
  .cards, .tracingContainer { display:flex; flex-wrap:wrap; justify-content:center; margin-top:20px; }
  .card { width:80px; height:80px; border:3px solid orange; margin:10px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; background:#fff0f0; cursor:pointer; position:relative; }
  .card.flipped { background:#cfffcc; border-color:green; }
  canvas { border:2px solid #ccc; background: url('assets/redandblueline.png') center/cover no-repeat; margin-top:10px; touch-action: none; }
  #eraser, #done { background:#ff7f7f; color:white; border:none; padding:8px 15px; margin:10px; border-radius:5px; font-size:1rem; cursor:pointer; }
  #letterImg { width:80px; display:block; margin: 0 auto; }
  #letterSound { cursor:pointer; margin-top:5px; }
</style>
</head>
<body>

<!-- Logo Screen -->
<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Game Screen -->
<div id="gameScreen">
  <div class="roundTitle" id="roundTitle"></div>
  <div class="instruction" id="instructionText"></div>
  <button class="hearAgain" id="hearAgainBtn"><img src="https://img.icons8.com/ios-filled/24/ffffff/speaker.png"/> Hear Again</button>

  <!-- Memory Cards -->
  <div class="cards" id="memoryCards"></div>

  <!-- Tracing -->
  <img id="letterImg" src="" alt="Letter">
  <img id="letterSound" src="https://img.icons8.com/ios-filled/24/000000/speaker.png" alt="Play Letter Sound">
  <div class="tracingContainer" id="tracingContainer">
    <canvas id="tracingCanvas" width="350" height="200"></canvas>
    <button id="eraser">Eraser</button>
    <button id="done">Done</button>
  </div>
</div>

<!-- End Screen -->
<div id="endScreen">
  <h1>Good Job!</h1>
  <button id="playAgain">Play Again</button>
</div>

<script>
const rounds = [
  { type:'memory', letters:['Mm','Nn','Oo','Pp'], images:['napkin.png','milk.png','olive.jpg','octopus.png'], question:'Flip over cards to find matching pairs of letter and picture card.' },
  { type:'trace', letter:'Mm', letterAudio:'assets/letterM.mp3', question:'Listen to the letter sound and write the letter Mm.' },
  { type:'memory', letters:['Mm','Nn','Oo','Pp'], images:['mountain.png','newspaper.png','pumpkin.png','panda.png'], question:'Flip over cards to find matching pairs of letter and picture card.' },
  { type:'trace', letter:'Nn', letterAudio:'assets/letterN.mp3', question:'Listen to the letter sound and write the letter Nn.' },
  { type:'memory', letters:['Mm','Nn','Oo','Pp'], images:['napkin.png','milk.png','onion.png','octopus.png'], question:'Flip over cards to find matching pairs of letter and picture card.' },
  { type:'trace', letter:'Oo', letterAudio:'assets/letterO.mp3', question:'Listen to the letter sound and write the letter Oo.' },
  { type:'memory', letters:['Mm','Nn','Oo','Pp'], images:['napkin.png','milk.png','mushroom.png','octopus.png'], question:'Flip over cards to find matching pairs of letter and picture card.' },
  { type:'trace', letter:'Pp', letterAudio:'assets/letterP.mp3', question:'Listen to the letter sound and write the letter Pp.' },
  { type:'memory', letters:['Mm','Nn','Oo','Pp'], images:['mountain.png','napkin.png','orange.png','ostrich.png'], question:'Flip over cards to find matching pairs of letter and picture card.' }
];

let currentRound = 0;
let selectedCards = [];

const logoScreen = document.getElementById('logoScreen');
const gameScreen = document.getElementById('gameScreen');
const memoryCards = document.getElementById('memoryCards');
const roundTitle = document.getElementById('roundTitle');
const instructionText = document.getElementById('instructionText');
const hearAgainBtn = document.getElementById('hearAgainBtn');
const letterImg = document.getElementById('letterImg');
const letterSound = document.getElementById('letterSound');
const tracingCanvas = document.getElementById('tracingCanvas');
const eraserBtn = document.getElementById('eraser');
const doneBtn = document.getElementById('done');
const endScreen = document.getElementById('endScreen');
const playAgainBtn = document.getElementById('playAgain');
const ctx = tracingCanvas.getContext('2d');

let isDrawing = false;

// Initialize logo
logoScreen.style.display = 'block';
setTimeout(() => { logoScreen.style.display = 'none'; startRound(); }, 5000);

// Start current round
function startRound(){
  memoryCards.innerHTML=''; ctx.clearRect(0,0,tracingCanvas.width,tracingCanvas.height);
  roundTitle.textContent = `Round ${currentRound+1}`;
  const round = rounds[currentRound];
  instructionText.textContent = round.question;
  gameScreen.style.display = 'block';

  // Play question audio automatically
  if(round.type === 'memory') playAudio(`assets/question${currentRound+1}.mp3`);
  else if(round.type === 'trace') playAudio(`assets/question${currentRound+1}.mp3`);

  hearAgainBtn.onclick = ()=> playAudio(`assets/question${currentRound+1}.mp3`);

  if(round.type==='memory'){
    const shuffled = shuffleArray([...round.letters.map((l,i)=>({letter:l,image:round.images[i]}))]);
    shuffled.forEach((cardObj,i)=>{
      const card = document.createElement('div');
      card.className='card';
      card.dataset.letter=cardObj.letter;
      card.dataset.image=cardObj.image;
      card.addEventListener('click', ()=> flipCard(card));
      memoryCards.appendChild(card);
    });
  } else {
    // Tracing round setup
    letterImg.src = `assets/${round.letter}.png`;
    letterSound.onclick = ()=> playAudio(round.letterAudio);
    enableTracing();
  }
}

// Memory card flip logic
function flipCard(card){
  if(card.classList.contains('flipped')) return;
  if(selectedCards.length===1 && selectedCards[0].dataset.letter===card.dataset.letter) return;
  
  card.classList.add('flipped'); card.textContent = card.dataset.letter;
  selectedCards.push(card);

  if(selectedCards.length===2){
    setTimeout(()=>{
      const [first,second] = selectedCards;
      if(first.dataset.letter === second.dataset.letter){
        // correct
        playAudio('assets/correct.mp3');
        first.style.borderColor='green';
        second.style.borderColor='green';
      } else {
        // wrong
        playAudio('assets/wrong.mp3');
        first.classList.remove('flipped'); first.textContent='';
        second.classList.remove('flipped'); second.textContent='';
      }
      selectedCards = [];
      if(document.querySelectorAll('.card:not(.flipped)').length===0){
        nextRound();
      }
    },600);
  }
}

// Tracing
function enableTracing(){
  let round = rounds[currentRound];
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  tracingCanvas.onpointerdown = e=> { isDrawing=true; ctx.beginPath(); ctx.moveTo(e.offsetX,e.offsetY);}
  tracingCanvas.onpointermove = e=> { if(isDrawing) { ctx.lineTo(e.offsetX,e.offsetY); ctx.stroke(); } }
  tracingCanvas.onpointerup = e=> { isDrawing=false; }
  eraserBtn.onclick = ()=> ctx.clearRect(0,0,tracingCanvas.width,tracingCanvas.height);
  doneBtn.onclick = ()=> nextRound();
}

// Next round
function nextRound(){
  currentRound++;
  if(currentRound>=rounds.length){
    gameScreen.style.display='none';
    endScreen.style.display='block';
  } else startRound();
}

// Play audio
function playAudio(path){
  let audio = new Audio(path);
  audio.play();
}

// Play again
playAgainBtn.onclick = ()=> { currentRound=0; endScreen.style.display='none'; startRound(); }

// Shuffle helper
function shuffleArray(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}
</script>
</body>
</html>
