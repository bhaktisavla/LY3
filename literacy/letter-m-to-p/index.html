<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Game – Letter Mm to Pp</title>
<style>
  body {
    margin: 0;
    font-family: 'Arbutus', cursive;
    background: url('assets/backdrop.png') center/cover no-repeat;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    color: #333;
  }
  #splash, #game, #endScreen {
    width: 100%;
    height: 100vh;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #splash img {
    width: 200px;
    height: auto;
  }
  h1 {
    font-size: 2em;
    margin: 10px;
    text-align: center;
    color: #4b2e83;
  }
  #questionBox {
    margin: 10px 0;
    font-size: 1.2em;
    text-align: center;
  }
  #hearAgain {
    cursor: pointer;
    color: #fff;
    background: #ff7f50;
    border: none;
    padding: 5px 10px;
    margin-left: 10px;
    border-radius: 5px;
  }
  #memoryCards, #tracingArea {
    display: grid;
    gap: 15px;
    justify-content: center;
    margin-top: 20px;
  }
  #memoryCards {
    grid-template-columns: repeat(4, 80px);
  }
  .card {
    width: 80px;
    height: 80px;
    background: #f8f1f1;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    border: 3px solid #ffb347;
    font-size: 2em;
    user-select: none;
    transition: transform 0.2s;
  }
  .card.giggle {
    animation: giggle 0.3s;
  }
  @keyframes giggle {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(10deg); }
    50% { transform: rotate(-10deg); }
    75% { transform: rotate(10deg); }
    100% { transform: rotate(0deg); }
  }
  .card.correct {
    border-color: green;
    background: #b9fbc0;
  }
  #tracingArea canvas {
    border: 2px solid #ccc;
    background: url('assets/redandblueline.png') center/cover no-repeat;
    border-radius: 10px;
    touch-action: none;
  }
  #eraserBtn {
    margin-top: 10px;
    padding: 5px 10px;
    background: #f08080;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  #endScreen button {
    margin-top: 20px;
    padding: 10px 20px;
    background: #4caf50;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1.2em;
    cursor: pointer;
  }
  #confettiCanvas {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<!-- Splash Screen -->
<div id="splash" style="display:flex;">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Game Container -->
<div id="game">
  <h1>Letter Mm to Pp</h1>
  <div id="questionBox">
    <span id="questionText"></span>
    <button id="hearAgain">Hear Again</button>
  </div>
  <div id="memoryCards"></div>
  <div id="tracingArea"></div>
  <button id="eraserBtn">Eraser</button>
</div>

<!-- End Screen -->
<div id="endScreen">
  <h1>Well Done!</h1>
  <button id="playAgainBtn">Play Again</button>
</div>

<canvas id="confettiCanvas"></canvas>

<!-- Audio -->
<audio id="correctAudio" src="assets/correct.mp3"></audio>
<audio id="wrongAudio" src="assets/wrong.mp3"></audio>
<audio id="clapAudio" src="assets/freesound_community-claps-44774.mp3"></audio>
<audio id="voiceAudio"></audio>

<script>
let currentRound = 0;
const rounds = [
  // Round 1 - Memory
  {type:'memory', letters:['Mm','Nn','Oo','Pp'], pics:['milk.png','napkin.png','octopus.png','paintbrush.png'], question:'Flip over cards to find matching pairs of letter and picture card.', voice:'assets/voice_round1.mp3'},
  // Round 2 - Tracing
  {type:'tracing', letter:'M', sound:'assets/letterM.mp3', question:'Listen to the letter sound and write the letter Mm.'},
  // Round 3 - Memory
  {type:'memory', letters:['Mm','Nn','Oo','Pp'], pics:['mirror.png','nest.png','olive.jpg','panda.png'], question:'Flip over cards to find matching pairs of letter and picture card.', voice:'assets/voice_round3.mp3'},
  // Round 4 - Tracing
  {type:'tracing', letter:'N', sound:'assets/letterN.mp3', question:'Listen to the letter sound and write the letter Nn.'},
  // Round 5 - Memory
  {type:'memory', letters:['Mm','Nn','Oo','Pp'], pics:['monkey.png','net.png','onion.jpg','parrot.png'], question:'Flip over cards to find matching pairs of letter and picture card.', voice:'assets/voice_round5.mp3'},
  // Round 6 - Tracing
  {type:'tracing', letter:'O', sound:'assets/letterO.mp3', question:'Listen to the letter sound and write the letter Oo.'},
  // Round 7 - Memory
  {type:'memory', letters:['Mm','Nn','Oo','Pp'], pics:['mountain.png','newspaper.png','orange.png','pumpkin.png'], question:'Flip over cards to find matching pairs of letter and picture card.', voice:'assets/voice_round7.mp3'},
  // Round 8 - Tracing
  {type:'tracing', letter:'P', sound:'assets/letterP.mp3', question:'Listen to the letter sound and write the letter Pp.'},
  // Round 9 - Memory
  {type:'memory', letters:['Mm','Nn','Oo','Pp'], pics:['mushroom.png','nose.png','ostrish.png','purse.png'], question:'Flip over cards to find matching pairs of letter and picture card.', voice:'assets/voice_round9.mp3'}
];

const splash = document.getElementById('splash');
const game = document.getElementById('game');
const endScreen = document.getElementById('endScreen');
const questionText = document.getElementById('questionText');
const hearAgainBtn = document.getElementById('hearAgain');
const memoryCards = document.getElementById('memoryCards');
const tracingArea = document.getElementById('tracingArea');
const eraserBtn = document.getElementById('eraserBtn');
const playAgainBtn = document.getElementById('playAgainBtn');
const voiceAudio = document.getElementById('voiceAudio');
const correctAudio = document.getElementById('correctAudio');
const wrongAudio = document.getElementById('wrongAudio');
const clapAudio = document.getElementById('clapAudio');

let firstCard=null;
let secondCard=null;
let wrongAttempts=0;

// Start Splash
splash.style.display='flex';
setTimeout(() => {
  splash.style.display='none';
  game.style.display='flex';
  startRound();
}, 5000);

hearAgainBtn.addEventListener('click', ()=> {
  if(rounds[currentRound].voice) voiceAudio.src = rounds[currentRound].voice;
  else if(rounds[currentRound].sound) voiceAudio.src = rounds[currentRound].sound;
  voiceAudio.play();
});

playAgainBtn.addEventListener('click', () => {
  currentRound = 0;
  endScreen.style.display='none';
  game.style.display='flex';
  startRound();
});

function startRound(){
  const round = rounds[currentRound];
  questionText.textContent = round.question;
  tracingArea.style.display='none';
  eraserBtn.style.display='none';
  memoryCards.innerHTML='';
  tracingArea.innerHTML='';
  
  if(round.type==='memory'){
    memoryCards.style.display='grid';
    const cardOrder = [...round.pics].sort(()=>Math.random()-0.5);
    // Top letters
    round.letters.forEach(letter => {
      const div = document.createElement('div');
      div.classList.add('card');
      div.dataset.letter = letter;
      div.textContent = letter;
      div.addEventListener('click', () => cardClick(div,round));
      memoryCards.appendChild(div);
    });
    // Bottom pictures
    cardOrder.forEach(pic=>{
      const div = document.createElement('div');
      div.classList.add('card');
      div.dataset.pic = pic;
      const img = document.createElement('img');
      img.src = 'assets/'+pic;
      img.style.width='70px';
      img.style.height='70px';
      div.appendChild(img);
      div.addEventListener('click', () => cardClick(div,round));
      memoryCards.appendChild(div);
    });
    if(round.voice){
      voiceAudio.src=round.voice;
      voiceAudio.play();
    }
  }
  else if(round.type==='tracing'){
    memoryCards.style.display='none';
    tracingArea.style.display='flex';
    eraserBtn.style.display='inline-block';
    // add sound icon
    const soundIcon = document.createElement('button');
    soundIcon.textContent='🔊';
    soundIcon.onclick = ()=> {voiceAudio.src = round.sound; voiceAudio.play();}
    tracingArea.appendChild(soundIcon);
    // add canvas
    const canvas = document.createElement('canvas');
    canvas.width=300;
    canvas.height=200;
    tracingArea.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    ctx.lineWidth=5;
    ctx.strokeStyle='black';
    let drawing=false;
    canvas.addEventListener('pointerdown',(e)=>drawing=true);
    canvas.addEventListener('pointerup',(e)=>drawing=false);
    canvas.addEventListener('pointermove',(e)=>{
      if(!drawing) return;
      const rect = canvas.getBoundingClientRect();
      ctx.lineTo(e.clientX-rect.left,e.clientY-rect.top);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(e.clientX-rect.left,e.clientY-rect.top);
    });
    eraserBtn.onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);}
  }
}

// Card Click Logic
function cardClick(card,round){
  if(card.classList.contains('correct')) return;
  if(!firstCard){
    firstCard=card;
    card.style.transform='scale(1.1)';
  } else {
    secondCard=card;
    if(checkMatch(firstCard,secondCard)){
      firstCard.classList.add('correct');
      secondCard.classList.add('correct');
      correctAudio.play();
      firstCard.style.transform='scale(1)';
      secondCard.style.transform='scale(1)';
      firstCard=null; secondCard=null;
      wrongAttempts=0;
      if(document.querySelectorAll('.card.correct').length===round.letters.length*2){
        clapAudio.play();
        setTimeout(()=>{nextRound()},1000);
      }
    } else {
      wrongAttempts++;
      wrongAudio.play();
      secondCard.classList.add('giggle');
      setTimeout(()=>secondCard.classList.remove('giggle'),300);
      setTimeout(()=>{
        secondCard=null;
      },500);
      if(wrongAttempts>=2){
        firstCard.classList.add('correct');
      }
    }
  }
}

function checkMatch(c1,c2){
  return c1.dataset.letter && c2.dataset.pic && c1.dataset.letter[0].toLowerCase() === c2.dataset.pic[0].toLowerCase();
}

function nextRound(){
  currentRound++;
  firstCard=null;
  secondCard=null;
  wrongAttempts=0;
  if(currentRound>=rounds.length){
    game.style.display='none';
    endScreen.style.display='flex';
    startConfetti();
  } else {
    startRound();
  }
}

// Simple confetti
function startConfetti(){
  const confettiCanvas = document.getElementById('confettiCanvas');
  confettiCanvas.width=window.innerWidth;
  confettiCanvas.height=window.innerHeight;
  const ctx = confettiCanvas.getContext('2d');
  const confetti = [];
  for(let i=0;i<100;i++){
    confetti.push({
      x:Math.random()*confettiCanvas.width,
      y:Math.random()*confettiCanvas.height,
      r:Math.random()*6+4,
      dx:Math.random()*2-1,
      dy:Math.random()*3+2,
      color:`hsl(${Math.random()*360},70%,60%)`
    });
  }
  function draw(){
    ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    confetti.forEach(c=>{
      ctx.beginPath();
      ctx.arc(c.x,c.y,c.r,0,2*Math.PI);
      ctx.fillStyle=c.color;
      ctx.fill();
      c.x+=c.dx;
      c.y+=c.dy;
      if(c.y>confettiCanvas.height){c.y=0;c.x=Math.random()*confettiCanvas.width;}
    });
    requestAnimationFrame(draw);
  }
  draw();
}
</script>

</body>
</html>
